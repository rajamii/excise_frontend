<div class="modal fade" id="addMoneyModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title fw-semibold">Payment Details</h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          aria-label="Close"
          (click)="onCloseClick()">  </button>
      </div>

      <div class="modal-body p-4">
        <div class="unified-pay-meta mb-3 d-flex align-items-center flex-wrap gap-2">
          <span class="badge bg-primary text-white border py-2 px-3 fs-6" *ngIf="context?.moduleLabel">{{ context?.moduleLabel }}</span>
          <span class="badge bg-light text-dark border py-2 px-3 fs-6">{{ context?.walletLabel }}</span>
        </div>

        <div class="alert alert-info py-2 px-3 mb-3 fw-semibold d-flex align-items-center" *ngIf="context?.purposeLabel" style="background-color: #e8f4fd; border-color: #b6d4fe; color: #084298; border-radius: 8px;">
          <i class="bi bi-info-circle-fill me-2 fs-5 text-primary"></i>
          <div>{{ context?.purposeLabel }}</div>
        </div>

        <div class="table-responsive">
          <table class="table table-borderless align-middle mb-0">
            <tbody>
              <tr class="unified-pay-row">
                <td class="fw-semibold w-35">Wallet Transaction ID <span class="text-danger">*</span></td>
                <td>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                    <input class="form-control" [value]="transactionId" readonly>
                  </div>
                </td>
              </tr>

              <tr class="unified-pay-row" *ngIf="context?.walletType !== 'security_deposit'">
                <td class="fw-semibold">Head Of Account <span class="text-danger">*</span></td>
                <td>
                  <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-info-circle-fill"></i></span>
                    <input class="form-control" [value]="context?.hoa || ''" readonly>
                  </div>
                </td>
              </tr>

              <tr class="unified-pay-row">
                <td class="fw-semibold">Amount <span class="text-danger">*</span></td>
                <td>
                  <div class="input-group">
                    <span class="input-group-text fw-bold">Rs</span>
                    <input
                      type="number"
                      min="0"
                      step="0.01"
                      class="form-control"
                      [ngModel]="amount"
                      (ngModelChange)="onAmountChange($event)"
                      [readonly]="context?.walletType === 'security_deposit'"
                      placeholder="0.00">
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Dev Testing Panel (Strictly Localhost Only) -->
        <div *ngIf="isLocalhost" class="mt-3 p-3 border border-warning rounded" style="background-color: #fffdf5; border-style: dashed !important;">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <div class="fw-bold text-warning-emphasis d-flex align-items-center gap-1" style="font-size: 0.85rem;">
              <i class="bi bi-gear-fill"></i>
              <span>Developer Testing Tools (Localhost Simulation)</span>
            </div>
            <span class="badge bg-warning text-dark fw-bold" style="font-size: 0.65rem;">DEV ONLY</span>
          </div>
          <p class="text-muted mb-2" style="font-size: 0.78rem; line-height: 1.35;">
            Simulate payment outcomes directly for this wallet recharge without connecting to gateway:
          </p>
          <div class="d-flex gap-2 flex-wrap">
            <button
              type="button"
              class="btn btn-sm btn-success fw-bold flex-grow-1"
              (click)="onSimulateClick('S')"
              [disabled]="amount <= 0"
              title="Simulate successful wallet recharge payment">
              <i class="bi bi-check-circle-fill me-1"></i>Sim: Success (Credit)
            </button>
            <button
              type="button"
              class="btn btn-sm btn-danger fw-bold flex-grow-1"
              (click)="onSimulateClick('F')"
              [disabled]="amount <= 0"
              title="Simulate failed payment">
              <i class="bi bi-x-circle-fill me-1"></i>Sim: Failed
            </button>
            <button
              type="button"
              class="btn btn-sm btn-outline-warning text-dark fw-bold flex-grow-1"
              style="border-color: #f59e0b; background-color: #fef3c7;"
              (click)="onSimulateClick('P')"
              [disabled]="amount <= 0"
              title="Simulate pending transaction (awaiting response)">
              <i class="bi bi-hourglass-split me-1"></i>Sim: Pending
            </button>
          </div>
        </div>
      </div>

      <div class="modal-footer justify-content-center gap-2">
        <!-- Force Pay Test Button: strictly visible only in local development (localhost) and hidden on live server -->
        <button
          type="button"
          class="btn btn-warning px-3 fw-bold shadow-sm"
          *ngIf="isLocalhost && context?.walletType === 'security_deposit'"
          (click)="onForcePayClick()"
          title="Simulate successful payment in localhost testing">
          <i class="bi bi-lightning-charge-fill me-1"></i>Force Pay Security (Test)
        </button>
        <button type="button" class="btn btn-success px-4" (click)="onProceedClick()">
          Proceed To Payment
        </button>
        <button type="button" class="btn btn-primary px-4" (click)="onCloseClick()">
          Back
        </button>
      </div>
    </div>
  </div>
</div>
