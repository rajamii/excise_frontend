<div class="access-denied-container">
  <div class="access-card">
    <div class="status-code">403</div>
    <h1>Access Denied</h1>
    <p>
      You do not have permission to access this page.
      Contact your administrator if you believe this is incorrect.
    </p>

    <div class="actions">
      <a *ngIf="isAuthenticated" routerLink="/dashboard" class="btn primary">Go to Dashboard</a>
      <a routerLink="/" class="btn secondary">Back to Home</a>
      <a *ngIf="!isAuthenticated" routerLink="/login" class="btn primary">Sign In</a>
    </div>
  </div>
</div>
