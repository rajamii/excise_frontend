@if (loading.topBarVisible()) {
  <mat-progress-bar class="top-loader" mode="indeterminate"></mat-progress-bar>
}

@if (loading.overlayVisible()) {
  <div class="page-loader-overlay" aria-live="polite" aria-busy="true">
    <div class="page-loader-card">
      <div class="glass-wrap" aria-hidden="true">
        <div class="glass-glow"></div>
        <!-- Glass design (no bottle) -->
        <svg class="glass" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="glassCupApp" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff6b35" stop-opacity="0.18"/>
              <stop offset="0.55" stop-color="#ff6b35" stop-opacity="0.10"/>
              <stop offset="1" stop-color="#cc5522" stop-opacity="0.16"/>
            </linearGradient>
            <linearGradient id="glassStrokeApp" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff6b35" stop-opacity="0.55"/>
              <stop offset="1" stop-color="#cc5522" stop-opacity="0.55"/>
            </linearGradient>
            <linearGradient id="drinkApp" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffcc00" stop-opacity="0.92"/>
              <stop offset="1" stop-color="#ff8a00" stop-opacity="0.92"/>
            </linearGradient>
            <linearGradient id="shineApp" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
          </defs>

          <!-- Round “sip” effect -->
          <circle class="sip-ring" cx="36" cy="36" r="28"></circle>
          <circle class="sip-arc" cx="36" cy="36" r="28"></circle>
          <g class="sip-orbit">
            <circle class="sip-dot" cx="36" cy="8" r="2.35"></circle>
          </g>

          <path d="M22 14c0-2.8 2.2-5 5-5h18c2.8 0 5 2.2 5 5 0 9.4-6.1 17.6-14.2 20.3V44h6.8c2 0 3.7 1.7 3.7 3.7S44.6 51.4 42.6 51.4H29.4c-2 0-3.7-1.7-3.7-3.7S27.4 44 29.4 44h6.8v-9.7C28.1 31.6 22 23.4 22 14z"
            fill="url(#glassCupApp)" stroke="url(#glassStrokeApp)" stroke-width="1.6" />

          <path class="drink-wave" d="M26.6 16.4c.2-1.2 1.3-2.1 2.6-2.1h13.6c1.3 0 2.4.9 2.6 2.1-.8 6.5-5.5 12.2-11.9 14.4-6.4-2.2-11.1-7.9-11.9-14.4z"
            fill="url(#drinkApp)" opacity="0.9"/>

          <path d="M28.8 13.2h2.2c.9 0 1.6.7 1.6 1.6v13.7c0 .8-.6 1.5-1.4 1.6-2.2-.9-4.2-2.5-5.8-4.7-.5-.7 0-1.6.9-1.6h.4c.7 0 1.3-.6 1.3-1.3V13.2z"
            fill="url(#shineApp)" opacity="0.55"/>
        </svg>
      </div>
      <div class="page-loader-title">Loading...</div>
      <div class="page-loader-sub">Please wait</div>
    </div>
  </div>
}

@if (isOffline) {
  <div class="offline-overlay" aria-live="assertive" aria-atomic="true">
    <div class="offline-card">
      <div class="offline-icon-wrapper">
        <!-- Disconnected Wi-Fi Icon / Dinosaur Alternative -->
        <svg xmlns="http://www.w3.org/2000/svg" class="offline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>
      <h2 class="offline-title">You are Offline</h2>
      <p class="offline-sub">It looks like there's a problem with your internet connection. We will automatically reconnect when the network is restored.</p>
    </div>
  </div>
}

<div class="content-wrapper">
  <app-header></app-header>

  @if (showCarousel) {
    <app-carousel></app-carousel>
  }

  <div class="main-content">
    <router-outlet></router-outlet>
  </div>

  <app-footer></app-footer>
</div>
