<!-- Main container for the sidenav layout with elevation and minimum height -->
@if (loaded) {
  <mat-sidenav-container class="mat-elevation-z8" style="padding: 0; min-height: 800px">
    <!-- Sidebar (sidenav) section -->
    <mat-sidenav #sidenav mode="side" [opened]="false">
      <!-- Header section of the sidebar with a close button -->
      <div class="sidenav-header">
        <button mat-icon-button (click)="snavToggle(sidenav)" color="primary">
          <mat-icon style="font-size: 27px">close</mat-icon>
        </button>
      </div>
      <!-- Content inside the sidebar -->
      <div class="sidebar-content">
        <!-- User profile section -->
        <div class="profile">
          <div class="username">
            {{userName}} <!-- Displays the user's name -->
          </div>
          <!-- Button to view the user's profile -->
          <button mat-mini-fab class="view-profile" (click)="viewProfile()" type="button">
            <mat-icon>account_circle</mat-icon>
          </button>
        </div>
        <!-- Divider line below the profile section -->
        <mat-divider class="profile-divider"></mat-divider>
        <!-- Navigation links -->
        @if (accountService.hasAnyRole(['licensee'])) {
          <mat-nav-list>
            <!-- Dashboard link -->
            <mat-list-item routerLink="dashboard" routerLinkActive="active-link">
              <span class="nav-header-cus">Dashboard</span>
            </mat-list-item>
            <!-- Apply License link with dialog trigger -->
            <mat-list-item (click)="openLicenseInfo()" class="nav-header-cus">
              <span class="nav-header-cus">Apply For License</span>
            </mat-list-item>
             <!-- Apply New License link with dialog trigger -->
            <mat-list-item (click)="openNewLicenseInfo()" class="nav-header-cus">
              <span class="nav-header-cus">Apply New License</span>
            </mat-list-item>
      <!-- Accordion Menu for Company Registration/Collaboration -->
            <mat-accordion>
              <mat-expansion-panel>
                <mat-expansion-panel-header>
            Company Registration/Collaboration
    </mat-expansion-panel-header>
    <div class="button-column">
      <button mat-menu-item routerLink="company-registration-and-collaboration/company-registration/prepare-application" routerLinkActive="active-link">Company Registration</button>
      <button mat-menu-item routerLink="company-registration-and-collaboration/company-collaboration/prepare-application" routerLinkActive="active-link">Company Collaboration</button>
    </div>
  </mat-expansion-panel>
</mat-accordion>
            
            <!-- Simplified Salesman/Barman Registration - Direct Navigation -->
            <mat-list-item routerLink="salesman-barman/prepare-application" routerLinkActive="active-link">
              <span class="nav-header-cus">
                Salesman/Barman Registration
              </span>
            </mat-list-item>
            
          </mat-nav-list>
        }
      </div>
    </mat-sidenav>
    <!-- Main content section -->
    <mat-sidenav-content>
      <!-- Toggle button to open the sidenav when it's closed -->
      <div class="toggle-btn">
        <button mat-icon-button [class.hidden]="isSidenavOpen" (click)="snavToggle(sidenav)" color="primary">
          <mat-icon style="font-size: 27px">menu</mat-icon>
        </button>
      </div>
      <!-- Router outlet to display routed components -->
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
}
