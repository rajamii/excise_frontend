<mat-horizontal-stepper [linear]="true" #stepper [class.hide-brand-confirmation]="!showBrandConfirmation">

  <!-- Step 1: Company Registration ID -->
  <mat-step label="Company Registration ID">
    <app-company-details
      [showBack]="false"
      (next)="stepper.next()">
    </app-company-details>
  </mat-step>

  <!-- Step 2: Company -->
  <mat-step label="Company">
    <app-bottler-details
      (back)="stepper.previous()"
      (next)="stepper.next()">
    </app-bottler-details>
  </mat-step>

  <!-- Step 3: Member Details -->
  <mat-step label="Member Details">
    <app-collab-member-details
      (back)="stepper.previous()"
      (next)="stepper.next()">
    </app-collab-member-details>
  </mat-step>

  <!-- Step 5: Brands -->
  <mat-step label="Brands">
    <app-select-brands
      (back)="stepper.previous()"
      (next)="onBrandsNext()">
    </app-select-brands>
  </mat-step>

  <!-- Step 4: Brand Confirmation - revealed only after Brands step is confirmed -->
  <mat-step label="Brand Confirmation">
    <app-brand-confirmation
      (back)="stepper.previous()"
      (next)="stepper.next()">
    </app-brand-confirmation>
  </mat-step>

  <!-- Step 5: Submit Application - review summary and submit (PDF Step 8) -->
  <mat-step label="Submit Application">
    <app-submit-application
      (back)="stepper.previous()">
    </app-submit-application>
  </mat-step>

</mat-horizontal-stepper>
