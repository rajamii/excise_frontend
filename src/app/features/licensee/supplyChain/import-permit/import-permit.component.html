<div class="bg-light min-vh-100">
  <!-- Government Header -->

  <br />
  <div class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-12">
        <!-- Main Form Card -->
        <div class="card shadow-lg border-0 mb-4" style="max-width: 1150px; margin: 0 auto">
          <div class="card-header bg-secondary text-white text-center py-3">
            <h4 class="mb-0 fw-bold">Requisition for Bulk Spirit Import Permit</h4>
          </div>
          <div class="card-body bg-white">
            <!-- Error Message -->
            <div class="alert alert-danger" *ngIf="errorMessage">
              {{ errorMessage }}
            </div>
            <div class="alert alert-warning" *ngIf="accessMessage">
              {{ accessMessage }}
            </div>

            <!-- Form Section -->
            <div class="form-section" *ngIf="!accessMessage">
              <div class="row mb-4">
                <div class="col-md-6">
                  <label class="form-label">Our Ref. No:</label>
                  <input type="text" class="form-control" [(ngModel)]="formData.refNo" readonly
                    placeholder="IBPS/01/EXCISE" title="Auto-generated" />
                  <small class="text-danger" *ngIf="refNoError">{{
                    refNoError
                    }}</small>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Date:</label>
                  <input type="date" class="form-control" [(ngModel)]="formData.date" required />
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-md-4">
                  <label class="form-label">Quantity (BL):</label>
                  <input type="number" class="form-control" [(ngModel)]="formData.quantity"
                    (ngModelChange)="calculateTotal()" required />
                </div>
                <div class="col-md-4">
                  <label class="form-label">No. of Permits:</label>
                  <input type="number" class="form-control" [(ngModel)]="formData.numberOfPermits"
                    (ngModelChange)="calculateTotal()" required />
                </div>
                <div class="col-md-4 d-flex flex-column align-items-center justify-content-center text-center">
                  <label class="form-label w-100 text-center">Total BL:</label>
                  <div class="form-control-plaintext fw-bold w-100 text-center fs-5 text-primary">
                    {{ calculatedTotal }}
                  </div>
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-md-6">
                  <label class="form-label">Bulk Spirit Type:</label>
                  <div class="position-relative">
                    <select #spiritTypeSelect class="form-select" [(ngModel)]="formData.bulkSpiritType"
                      (change)="onBulkSpiritTypeChange()" [disabled]="isLoading" required>
                      <option value="">Select Bulk Spirit Type</option>
                      <option *ngFor="let type of bulkSpiritTypes; let i = index" [value]="type.bulkSpiritKindType "
                        [attr.data-index]="i">
                        {{ type.bulkSpiritKindType }}
                      </option>
                    </select>
                    <div *ngIf="isLoading" class="position-absolute top-0 end-0 me-2 mt-2">
                      <div class="spinner-border spinner-border-sm" role="status">
                        <span class="visually-hidden">Loading...</span>
                      </div>
                    </div>
                  </div>
                  <div *ngIf="!isLoading && bulkSpiritTypes.length === 0" class="text-danger small mt-1">
                    No bulk spirit types available
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Strength:</label>
                  <select class="form-select" [(ngModel)]="formData.strengthTo" (change)="onStrengthChange()"
                    [disabled]="!formData.bulkSpiritType || isLoading" required>
                    <option value="">Select Strength</option>
                    <option *ngFor="let strength of availableStrengths" [value]="strength">
                      {{ strength }}
                    </option>
                  </select>
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-md-6">
                  <label class="form-label">Price / BL:</label>
                  <input type="text" class="form-control" [value]="selectedPricePerBl | number:'1.2-2'" readonly />
                </div>
                <div class="col-md-6">
                  <label class="form-label">Payable Amount:</label>
                  <input type="text" class="form-control fw-bold text-success"
                    [value]="calculatedPayableAmount | number:'1.2-2'" readonly />
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-md-6">
                  <label class="form-label">Lifted From:</label>
                  <div *ngIf="isLoading" class="d-flex align-items-center mb-2">
                    <div class="spinner-border spinner-border-sm me-2" role="status">
                      <span class="visually-hidden">Loading...</span>
                    </div>
                    <span>Loading distilleries...</span>
                  </div>

                  <div *ngIf="!isLoading">
                    <select class="form-select" [(ngModel)]="formData.liftedFrom" (ngModelChange)="onLiftedFromChange()"
                      [disabled]="distilleries.length === 0" [class.is-invalid]="distilleries.length === 0" required>
                      <option [ngValue]="''">Select Distillery</option>
                      <option *ngFor="let distillery of distilleries" [value]="distillery.id.toString()">
                        {{
                        distillery.distilleryName

                        }}
                        ({{
                        distillery.distilleryState

                        }})
                      </option>
                    </select>

                    <div *ngIf="distilleries.length === 0" class="invalid-feedback">
                      <i class="bi bi-exclamation-triangle-fill me-1"></i>
                      No distilleries available. Please try again later.
                    </div>
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Via Route:</label>
                  <input type="text" class="form-control" [(ngModel)]="formData.viaRoute"
                    placeholder="Enter route details" required />
                </div>
              </div>

              <div class="row mb-4">
                <div class="col-md-6">
                  <label class="form-label">Checkpost Entry:</label>
                  <select class="form-select" [(ngModel)]="formData.checkpostEntry" name="checkpostEntry" required
                    [disabled]="isLoading">
                    <option [ngValue]="''">Select Checkpost</option>
                    <option *ngFor="let checkpost of checkposts" [ngValue]="checkpost.checkPostName">
                      {{ checkpost.checkPostName }}
                    </option>
                  </select>
                  <div *ngIf="isLoading" class="text-muted small">
                    Loading checkposts...
                  </div>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Choose Purpose:</label>
                  <select class="form-select" [(ngModel)]="formData.purpose" name="purpose" required
                    [disabled]="isLoading">
                    <option [ngValue]="''">Select Purpose</option>
                    <option *ngFor="let purpose of purposes" [ngValue]="purpose.purposeName">
                      {{ purpose.purposeName }}
                    </option>
                  </select>
                  <div *ngIf="isLoading" class="text-muted small">
                    Loading purposes...
                  </div>
                </div>
              </div>

              <!-- Action Buttons -->
              <div class="d-flex justify-content-center mt-4 gap-2">
                <button class="btn btn-success" (click)="submitForm()">
                  <i class="bi bi-check-circle me-1"></i>Submit
                </button>
                <button class="btn btn-outline-secondary" (click)="goBack()">
                  <i class="bi bi-arrow-left me-1"></i>Back
                </button>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
