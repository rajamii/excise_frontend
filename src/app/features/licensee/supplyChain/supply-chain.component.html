<div class="dashboard-container">
  <!-- Header Section -->
  <div class="header-section">
    <div class="header-content">
      <div class="header-left">
        <h1 class="dashboard-title">Dashboard</h1>
        <p class="licensee-info">Licensee: Sikkim Distilleries Ltd (01202506012)</p>
      </div>
      <div class="header-right">
        <button class="btn btn-primary distillery-btn">Distillery</button>
        <button class="btn btn-secondary view-widget-btn">
          <i class="icon-widget"></i> View Widget
        </button>
      </div>
    </div>
  </div>

  <!-- Search Section -->
  <div class="search-section">
    <div class="search-container">
      <input 
        type="date" 
        class="form-control date-input" 
        placeholder="Enter date"
        [(ngModel)]="selectedDate">
      <button class="btn btn-search" (click)="onSearch()">Search</button>
      <button class="btn btn-clear" (click)="onClear()">Clear</button>
    </div>
  </div>

  <!-- Tabs Section -->
  <div class="tabs-section">
    <div class="tab-container">
      <button 
        class="tab-btn" 
        [class.active]="activeTab === 'requisition'"
        (click)="setActiveTab('requisition')">
        REQUISITION
      </button>
      <button 
        class="tab-btn" 
        [class.active]="activeTab === 'revliquidation'"
        (click)="setActiveTab('revliquidation')">
        REVLIQUIDATION
      </button>
      <button 
        class="tab-btn" 
        [class.active]="activeTab === 'cancellation'"
        (click)="setActiveTab('cancellation')">
        CANCELLATION
      </button>
      <button 
        class="tab-btn" 
        [class.active]="activeTab === 'transit'"
        (click)="setActiveTab('transit')">
        TRANSIT
      </button>
    </div>
  </div>

  <!-- Data Table Section -->
  <div class="table-section">
    <div class="table-container">
      <table class="data-table">
        <thead>
          <tr>
            <th>Reference No</th>
            <th>Application Submission Date</th>
            <th>Distillery Name</th>
            <th>Status</th>
            <th>Import Pass Fee Amount</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of tableData" class="table-row">
            <td>{{ item.referenceNo }}</td>
            <td>{{ item.submissionDate }}</td>
            <td>{{ item.distilleryName }}</td>
            <td class="status-cell">
              <span class="status-message">{{ item.status }}</span>
            </td>
            <td class="amount-cell">
              <span class="currency-symbol">₹</span>
              <span class="amount">{{ item.amount }}</span>
            </td>
            <td class="action-cell">
              <button class="btn btn-view-application" (click)="viewApplication(item)">
                VIEW APPLICATION
              </button>
              <button class="btn btn-view-slip" (click)="viewSlip(item)">
                View Permit Slip
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>


</div>
