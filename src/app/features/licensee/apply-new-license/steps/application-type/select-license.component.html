<form [formGroup]="selectLicenseForm">
  <mat-card>
    <mat-card-header>
      <div class="heading">Application Type</div>
      <div class="validation">
        * Marked Fields Are Mandatory
      </div>
    </mat-card-header>

    <mat-card-content>
      <div class="form-field-container">
        <!-- Excise District Dropdown -->
        <mat-radio-group formControlName="licenseTypes">
          @for (licenseType of licenseTypes; track licenseType) {
          <mat-radio-button [value]="licenseType.id">
            {{ licenseType.licenseType }}
          </mat-radio-button>
        }
        </mat-radio-group>
        <div
          *ngIf="selectLicenseForm.get('licenseTypes')?.invalid && (selectLicenseForm.get('licenseTypes')?.touched || selectLicenseForm.get('licenseTypes')?.dirty)">
          <span class="error-text">This field is required</span>
        </div>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button matButton="filled" color="warn" (click)="resetForm()">Reset</button>
      <button matButton="filled" color="primary" (click)="proceedToNext()" [disabled]="!selectLicenseForm.valid">
        Next
      </button>
    </mat-card-actions>
  </mat-card>
</form>
