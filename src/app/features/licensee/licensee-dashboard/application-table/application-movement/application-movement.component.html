<div class="dialog-container" align="center">
  <h2 mat-dialog-title>Application Movement</h2>

  <mat-dialog-content>
    <table mat-table [dataSource]="movementDataSource">

      <!-- Sl. No Column -->
      <ng-container matColumnDef="slNo">
        <th mat-header-cell *matHeaderCellDef> Sl. No </th>
        <td mat-cell *matCellDef="let _; let i = index"> {{ i + 1 }} </td>
      </ng-container>

      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef> Date </th>
        <td mat-cell *matCellDef="let element"> {{ element.timestamp | date: 'dd-MM-yyyy, hh:mm a' }} </td>
      </ng-container>

      <!-- Forwarded By -->
      <ng-container matColumnDef="forwardedBy">
        <th mat-header-cell *matHeaderCellDef> Forwarded By </th>
        <td mat-cell *matCellDef="let element">
          {{ getRoleLabel(element.forwardedBy?.roleName) }}
        </td>
      </ng-container>

      <!-- Forwarded To -->
      <ng-container matColumnDef="forwardedTo">
        <th mat-header-cell *matHeaderCellDef> Forwarded To </th>
        <td mat-cell *matCellDef="let element">
          {{ getRoleLabel(element.forwardedTo?.name) }}
        </td>
      </ng-container>

      <!-- Remarks -->
      <ng-container matColumnDef="remarks">
        <th mat-header-cell *matHeaderCellDef> Remarks </th>
        <td mat-cell *matCellDef="let element"> {{ element.remarks }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="movementColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: movementColumns;"></tr>
    </table>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button matButton="filled" color="warn" mat-dialog-close>
      Close
    </button>
  </mat-dialog-actions>
</div>
