<div class="imfl-header-wrapper mb-3">
  <div class="imfl-banner">
    <div class="imfl-banner__left">
      <div class="imfl-banner__icon">
        <mat-icon>local_shipping</mat-icon>
      </div>
      <div>
        <h2 class="imfl-banner__title">IMFL Import Permit Management</h2>
        <p class="imfl-banner__subtitle">Manage IMFL Requisitions, Permit Revalidations, and Cancellations</p>
      </div>
    </div>
    <div class="imfl-banner__right" *ngIf="activeTab === 'requisition' && !isFormView">
      <button mat-raised-button color="primary" class="imfl-apply-btn" (click)="onApplyNewClick()">
        <mat-icon>add_circle</mat-icon>
        Apply for Import Permit
      </button>
    </div>
  </div>

  <nav class="imfl-tabs-bar">
    <button
      class="imfl-tab-btn"
      [class.active]="activeTab === 'requisition'"
      (click)="selectTab('requisition')"
      type="button"
    >
      <mat-icon>assignment</mat-icon>
      <span>IMFL Requisition</span>
      <span class="imfl-tab-badge" *ngIf="pendingCounts['requisition']">{{ pendingCounts['requisition'] }}</span>
    </button>

    <button
      class="imfl-tab-btn"
      [class.active]="activeTab === 'revalidation'"
      (click)="selectTab('revalidation')"
      type="button"
    >
      <mat-icon>update</mat-icon>
      <span>IMFL Revalidation</span>
      <span class="imfl-tab-badge" *ngIf="pendingCounts['revalidation']">{{ pendingCounts['revalidation'] }}</span>
    </button>

    <button
      class="imfl-tab-btn"
      [class.active]="activeTab === 'cancellation'"
      (click)="selectTab('cancellation')"
      type="button"
    >
      <mat-icon>cancel</mat-icon>
      <span>IMFL Cancellation</span>
      <span class="imfl-tab-badge" *ngIf="pendingCounts['cancellation']">{{ pendingCounts['cancellation'] }}</span>
    </button>
  </nav>
</div>
