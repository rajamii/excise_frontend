<mat-card>
  <mat-card-header>
    <div class="heading">Submit Application</div>
  </mat-card-header>

  <mat-card-content>
    <!-- Dynamically render grouped data sections -->
    <ng-container *ngFor="let section of displaySections">
      <div class="section-title" *ngIf="!section.condition || section.condition()">
        {{ section.title }}
      </div>
      <div class="section-table" *ngIf="!section.condition || section.condition()">
        <div class="row" *ngFor="let item of section.data">
          <div class="key">{{ item.key }}</div>
          <div class="value">{{ item.value || 'N/A' }}</div>
        </div>
      </div>
    </ng-container>

    <!-- Member Details section with photo display -->
    <div class="section-title">Member Details</div>
    <div class="details-with-photo">
      <div class="left-section">
        <div class="row" *ngFor="let item of memberDetailsData">
          <div class="key">{{ item.key }}</div>
          <div class="value">{{ item.value || 'N/A' }}</div>
        </div>
      </div>

      <!-- Photo display (if photo URL is available) -->
      <div class="photo-section" *ngIf="passPhotoUrl">
        <img class="profile-photo" [src]="passPhotoUrl" alt="Applicant Photo" />
      </div>
    </div>
  </mat-card-content>

  <!-- Action buttons -->
  <mat-card-actions>
    <button mat-stroked-button (click)="goBack()">Back</button>
    <button mat-flat-button color="primary" (click)="submit()">Submit</button>
  </mat-card-actions>
</mat-card>
