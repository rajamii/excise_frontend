<div class="container-fluid">
  <!-- Header section of the card -->
  <h2 mat-dialog-title>Add License Category</h2>

    <!-- Template-driven form reference -->
  <form #newLicenseCategoryForm="ngForm">
    <mat-dialog-content>
      <!-- License Category Name input field -->
      <mat-form-field appearance="outline">
        <mat-label>License Category Name</mat-label>
        <input
          matInput
          [(ngModel)]="licenseCategory.licenseCategory"
          name="licenseCategoryName"
          #licenseCategoryName="ngModel"
          placeholder="Enter License Category Name"
          maxlength="150"
          minlength="3"
          required
          />
      </mat-form-field>


      <!-- Error message displayed if the input is invalid after touch or change -->
      @if ((licenseCategoryName.dirty || licenseCategoryName.touched) && licenseCategoryName.invalid) {
        <div>
          @if (licenseCategoryName.errors?.['required']) {
            <mat-error>
              <small>This field is required.</small>
            </mat-error>
          }
        </div>
      }
    </mat-dialog-content>

    <!-- Buttons for save and cancel -->
    <mat-dialog-actions>
      <button matButton="filled" color="primary" (click)="onSave()" [disabled]="newLicenseCategoryForm.form.invalid">Save</button>
      <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
    </mat-dialog-actions>
  </form>
</div>
