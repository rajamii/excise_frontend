<div class="container-fluid">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit' : 'Add' }} License Title</h2>

  <form #form="ngForm">
    <mat-dialog-content>
      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <input matInput [(ngModel)]="licenseTitle.description" name="description" required />
        <mat-error *ngIf="form.submitted && !licenseTitle.description">Description is required.</mat-error>
      </mat-form-field>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-raised-button color="primary" (click)="onSave()">Save</button>
      <button mat-raised-button color="warn" (click)="onCancel()">Cancel</button>
    </mat-dialog-actions>
  </form>
</div>
