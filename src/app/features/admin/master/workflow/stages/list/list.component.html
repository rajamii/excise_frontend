<div class="container-fluid">
    <mat-card>
      <mat-card-header>
        <div class="page-title">Workflow Stages List</div>
        <button matButton="filled" (click)="onAdd()">
          <mat-icon>add</mat-icon> Add Stage
        </button>
      </mat-card-header>
  
      <mat-card-content>
        <div class="table-container">
          <mat-table [dataSource]="stages">
            <ng-container matColumnDef="name">
              <mat-header-cell *matHeaderCellDef class="small-column"> Name </mat-header-cell>
              <mat-cell *matCellDef="let stage" class="small-column"> {{ stage.name }} </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="workflow">
              <mat-header-cell *matHeaderCellDef class="small-column"> Workflow </mat-header-cell>
              <mat-cell *matCellDef="let stage" class="small-column">
                {{ stage.workflow?.name || stage.workflow }}
              </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="description">
              <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
              <mat-cell *matCellDef="let stage"> {{ stage.description || '-' }} </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="is_initial">
              <mat-header-cell *matHeaderCellDef class="narrow-column"> Initial </mat-header-cell>
              <mat-cell *matCellDef="let stage" class="narrow-column"> {{ stage.isInitial ? 'Yes' : 'No' }} </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="is_final">
              <mat-header-cell *matHeaderCellDef class="narrow-column"> Final </mat-header-cell>
              <mat-cell *matCellDef="let stage" class="narrow-column"> {{ stage.isFinal ? 'Yes' : 'No' }} </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="actions">
              <mat-header-cell *matHeaderCellDef class="action-column"> Actions </mat-header-cell>
              <mat-cell *matCellDef="let stage" class="action-column">
                <button matIconButton color="primary" (click)="onEdit(stage)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button matIconButton color="warn" (click)="onDelete(stage)">
                  <mat-icon>delete</mat-icon>
                </button>
              </mat-cell>
            </ng-container>
  
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
          </mat-table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
