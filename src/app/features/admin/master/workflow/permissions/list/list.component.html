<div class="container-fluid">
    <mat-card>
      <mat-card-header>
        <div class="page-title">Stage Permissions List</div>
        <button matButton="filled" (click)="onAdd()">
          <mat-icon>add</mat-icon> Add Permission
        </button>
      </mat-card-header>
  
      <mat-card-content>
        <div class="table-container">
          <mat-table [dataSource]="permissions">
            <ng-container matColumnDef="stage">
              <mat-header-cell *matHeaderCellDef class="small-column"> Stage </mat-header-cell>
              <mat-cell *matCellDef="let permission" class="small-column">
                {{ permission.stage?.name || permission.stage }}
              </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="role">
              <mat-header-cell *matHeaderCellDef class="small-column"> Role </mat-header-cell>
              <mat-cell *matCellDef="let permission" class="small-column">
                {{ permission.role?.name || permission.role }}
              </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="can_process">
              <mat-header-cell *matHeaderCellDef class="narrow-column"> Can Process </mat-header-cell>
              <mat-cell *matCellDef="let permission" class="narrow-column">
                {{ permission.canProcess ? 'Yes' : 'No' }}
              </mat-cell>
            </ng-container>
  
            <ng-container matColumnDef="actions">
              <mat-header-cell *matHeaderCellDef class="action-column"> Actions </mat-header-cell>
              <mat-cell *matCellDef="let permission" class="action-column">
                <button matIconButton color="primary" (click)="onEdit(permission)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button matIconButton color="warn" (click)="onDelete(permission)">
                  <mat-icon>delete</mat-icon>
                </button>
              </mat-cell>
            </ng-container>
  
            <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
            <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
          </mat-table>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
