<div class="container-fluid">
  <h2 mat-dialog-title align="center">
    {{ isEditMode ? 'Edit' : 'Add' }} Brand Owner
  </h2>

  <form #form="ngForm">
    <mat-dialog-content>

      <!-- Brand Owner Code -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Brand Owner Code</mat-label>
        <input
          matInput
          name="brand_owner_code"
          required
          [disabled]="isEditMode"
          [(ngModel)]="owner.brand_owner_code"
          #codeModel="ngModel"
        />
        <mat-error *ngIf="codeModel.errors?.['required']">
          Code is required
        </mat-error>
      </mat-form-field>

      <!-- Brand Owner Name -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Company/Brand Owner Name</mat-label>
        <input
          matInput
          name="brand_owner_name"
          required
          [(ngModel)]="owner.brand_owner_name"
          #nameModel="ngModel"
        />
        <mat-error *ngIf="nameModel.errors?.['required']">
          Name is required
        </mat-error>
      </mat-form-field>

      <!-- Address -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Address</mat-label>
        <textarea
          matInput
          rows="3"
          name="brand_owner_address"
          [(ngModel)]="owner.brand_owner_address"
        ></textarea>
      </mat-form-field>

      <!-- Pincode -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Pin Code</mat-label>
        <input
          matInput
          name="brand_owner_pincode"
          [(ngModel)]="owner.brand_owner_pincode"
        />
      </mat-form-field>

      <!-- Licensee ID No -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Licensee ID No</mat-label>
        <input
          matInput
          name="brand_owner_licensee_id_no"
          [(ngModel)]="owner.brand_owner_licensee_id_no"
        />
      </mat-form-field>

      <!-- Origin Selection -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Origin</mat-label>
        <mat-select
          [(ngModel)]="owner.brand_owner_origin"
          name="brand_owner_origin"
          required
        >
          <mat-option value="I">In-State</mat-option>
          <mat-option value="O">Out-of-State</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Type Selection -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Type</mat-label>
        <mat-select
          [(ngModel)]="owner.brand_owner_type"
          name="brand_owner_type"
          required
        >
          <mat-option [value]="1">Manufactured in Sikkim</mat-option>
          <mat-option [value]="2">Imported from other States/Country</mat-option>
          <mat-option [value]="3">Bottled in Sikkim (Collaboration)</mat-option>
        </mat-select>
      </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions align="center">
      <button mat-button type="button" (click)="onCancel()">Cancel</button>
      <button mat-raised-button color="primary" [disabled]="form.invalid" (click)="onSave()">
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
