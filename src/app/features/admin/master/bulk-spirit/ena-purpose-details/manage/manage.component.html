<div class="dialog-wrapper">
  <h2 mat-dialog-title>
    <mat-icon class="title-icon">assignment</mat-icon>
    {{ isEditMode ? 'Edit ENA Purpose' : 'Add ENA Purpose' }}
  </h2>

  <div mat-dialog-content class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Purpose Name</mat-label>
      <input matInput [(ngModel)]="row.purposeName" placeholder="e.g. Manufacturing" />
    </mat-form-field>
  </div>

  <div mat-dialog-actions class="dialog-actions">
    <button class="btn-cancel" (click)="onCancel()">
      <mat-icon>close</mat-icon>
      Cancel
    </button>
    <button class="btn-save" (click)="onSave()">
      <mat-icon>save</mat-icon>
      {{ isEditMode ? 'Update' : 'Save' }}
    </button>
  </div>
</div>
