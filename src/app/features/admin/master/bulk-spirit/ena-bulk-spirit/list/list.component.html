<div class="container-fluid">
  <mat-card>
    <mat-card-header class="page-card-header">
      <div class="page-title">ENA Bulk Spirit Details</div>
      <button mat-flat-button color="primary" (click)="onAdd()" style="border-radius: 8px;">
        <mat-icon>add</mat-icon> Add
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="groupedRows">

          <!-- License Name Column -->
          <ng-container matColumnDef="licenseName">
            <mat-header-cell *matHeaderCellDef>License / Establishment</mat-header-cell>
            <mat-cell *matCellDef="let row" style="font-weight: 600; color: #1e293b;">
              {{ row.licenseName }}
            </mat-cell>
          </ng-container>

          <!-- License ID Column -->
          <ng-container matColumnDef="licenseId">
            <mat-header-cell *matHeaderCellDef>License ID</mat-header-cell>
            <mat-cell *matCellDef="let row">
              <code style="background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #475569;">
                {{ row.licenseId || 'Unassigned' }}
              </code>
            </mat-cell>
          </ng-container>

          <!-- Spirits List Column -->
          <ng-container matColumnDef="spiritsList">
            <mat-header-cell *matHeaderCellDef>Assigned Spirit Types</mat-header-cell>
            <mat-cell *matCellDef="let row">
              <span class="badge" style="background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 0.85rem;">
                {{ row.spiritCount }} assigned
              </span>
            </mat-cell>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
            <mat-cell *matCellDef="let row">
              <button mat-flat-button color="primary" (click)="onViewDetails(row)" style="border-radius: 8px; display: flex; align-items: center; gap: 4px;">
                <mat-icon style="font-size: 18px; width: 18px; height: 18px; margin: 0;">visibility</mat-icon>
                <span>View Details</span>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </mat-table>

        @if (groupedRows.length === 0) {
          <div class="no-data">No records found.</div>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
