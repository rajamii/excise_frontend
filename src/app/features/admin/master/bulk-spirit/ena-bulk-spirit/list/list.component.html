<div class="page">
  <div class="page-header">
    <h2>ENA Bulk Spirit Details</h2>
    <button mat-raised-button color="primary" (click)="onAdd()">Add</button>
  </div>

  <div class="table-wrap">
    <table mat-table [dataSource]="rows" class="mat-elevation-z2 full-width">
      <ng-container matColumnDef="bulkSpiritKindType">
        <th mat-header-cell *matHeaderCellDef>Bulk Spirit Type</th>
        <td mat-cell *matCellDef="let row">{{ row.bulkSpiritKindType }}</td>
      </ng-container>

      <ng-container matColumnDef="strength">
        <th mat-header-cell *matHeaderCellDef>Strength</th>
        <td mat-cell *matCellDef="let row">{{ row.strength }}</td>
      </ng-container>

      <ng-container matColumnDef="priceBl">
        <th mat-header-cell *matHeaderCellDef>Price / BL</th>
        <td mat-cell *matCellDef="let row">{{ row.priceBl }}</td>
      </ng-container>

      <ng-container matColumnDef="licenseId">
        <th mat-header-cell *matHeaderCellDef>Assigned License</th>
        <td mat-cell *matCellDef="let row">{{ row.licenseId || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-button color="primary" (click)="onEdit(row)">Edit</button>
          <button mat-button color="warn" (click)="onDelete(row)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
