<div class="container-fluid">
  <mat-card>
    <mat-card-header class="page-card-header">
      <div class="page-title">Check Post Details</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="rows">

          <ng-container matColumnDef="checkPostName">
            <mat-header-cell *matHeaderCellDef>Check Post Name</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.checkPostName }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="isActive">
            <mat-header-cell *matHeaderCellDef>Status</mat-header-cell>
            <mat-cell *matCellDef="let row">
              <mat-slide-toggle
                [checked]="row.isActive"
                color="primary"
                (change)="onToggleActive(row)"
                [matTooltip]="row.isActive ? 'Active — click to deactivate' : 'Inactive — click to activate'">
              </mat-slide-toggle>
            </mat-cell>
          </ng-container>

          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
            <mat-cell *matCellDef="let row">
              <button matIconButton color="primary" (click)="onEdit(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </mat-table>

        @if (rows.length === 0) {
          <div class="no-data">No records found.</div>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
