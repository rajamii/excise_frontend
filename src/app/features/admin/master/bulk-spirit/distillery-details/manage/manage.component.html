<h2 mat-dialog-title>{{ isEditMode ? 'Edit Distillery Details' : 'Add Distillery Details' }}</h2>

<div mat-dialog-content class="form">
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Distillery Name</mat-label>
    <input matInput [(ngModel)]="row.distilleryName" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Address</mat-label>
    <textarea matInput rows="2" [(ngModel)]="row.distilleryAddress"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>State</mat-label>
    <input matInput [(ngModel)]="row.distilleryState" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Via Route</mat-label>
    <textarea matInput rows="2" [(ngModel)]="row.viaRoute"></textarea>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Assign License</mat-label>
    <mat-select [(ngModel)]="row.licenseeId">
      <mat-option [value]="null">Unassigned</mat-option>
      <mat-option *ngFor="let lic of licenses" [value]="lic.licenseeId">
        {{ lic.establishmentName }} ({{ lic.licenseeId }})
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSave()">
    {{ isEditMode ? 'Update' : 'Save' }}
  </button>
</div>
