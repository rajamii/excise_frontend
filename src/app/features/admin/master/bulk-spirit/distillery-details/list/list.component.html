<div class="container-fluid">
  <mat-card>
    <mat-card-header class="page-card-header">
      <div class="page-title">Lifted From Details</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="rows">

          <ng-container matColumnDef="distilleryName">
            <mat-header-cell *matHeaderCellDef>Lifted From</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.distilleryName }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="distilleryState">
            <mat-header-cell *matHeaderCellDef>State</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.distilleryState }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="viaRoute">
            <mat-header-cell *matHeaderCellDef>Route</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.viaRoute || '-' }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="licenseeId">
            <mat-header-cell *matHeaderCellDef>Assigned License</mat-header-cell>
            <mat-cell *matCellDef="let row">{{ row.licenseeId || '-' }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
            <mat-cell *matCellDef="let row">
              <button matIconButton color="primary" (click)="onEdit(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </mat-table>

        @if (rows.length === 0) {
          <div class="no-data">No records found.</div>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
