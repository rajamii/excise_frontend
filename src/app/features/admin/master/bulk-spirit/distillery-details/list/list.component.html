<div class="page">
  <div class="page-header">
    <h2>Distillery Names Details</h2>
    <button mat-raised-button color="primary" (click)="onAdd()">Add</button>
  </div>

  <div class="table-wrap">
    <table mat-table [dataSource]="rows" class="mat-elevation-z2 full-width">
      <ng-container matColumnDef="distilleryName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let row">{{ row.distilleryName }}</td>
      </ng-container>

      <ng-container matColumnDef="distilleryState">
        <th mat-header-cell *matHeaderCellDef>State</th>
        <td mat-cell *matCellDef="let row">{{ row.distilleryState }}</td>
      </ng-container>

      <ng-container matColumnDef="licenseeId">
        <th mat-header-cell *matHeaderCellDef>Assigned License</th>
        <td mat-cell *matCellDef="let row">{{ row.licenseeId || '-' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let row">
          <button mat-button color="primary" (click)="onEdit(row)">Edit</button>
          <button mat-button color="warn" (click)="onDelete(row)">Delete</button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
