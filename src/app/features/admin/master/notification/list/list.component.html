<div class="container-fluid">
  <mat-card>
    <mat-card-header>
      <div class="page-title">Notifications</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add Notification
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="notifications">

          <ng-container matColumnDef="notificationDate">
            <mat-header-cell *matHeaderCellDef> Date </mat-header-cell>
            <mat-cell *matCellDef="let row"> {{ row.notificationDate | date: 'dd/MM/yyyy' }} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="subject">
            <mat-header-cell *matHeaderCellDef> Subject </mat-header-cell>
            <mat-cell *matCellDef="let row"> {{ row.subject }} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="category">
            <mat-header-cell *matHeaderCellDef> Category </mat-header-cell>
            <mat-cell *matCellDef="let row"> {{ categoryLabels[row.category] }} </mat-cell>
          </ng-container>

          <ng-container matColumnDef="image">
            <mat-header-cell *matHeaderCellDef> Image </mat-header-cell>
            <mat-cell *matCellDef="let row">
              <button
                matIconButton
                color="primary"
                title="View image"
                aria-label="View image"
                [disabled]="!canViewFile(row)"
                (click)="viewFile(row)">
                <mat-icon>visibility</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let row">
              <button matIconButton color="primary" (click)="onEdit(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
