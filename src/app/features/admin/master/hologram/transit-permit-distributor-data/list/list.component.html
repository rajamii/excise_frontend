<div class="container-fluid">
  <mat-card>
    <mat-card-header class="page-card-header">
      <div class="page-title">Transit Permit Distributor Data</div>

      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="rows">
          <ng-container matColumnDef="licenseId">
            <mat-header-cell *matHeaderCellDef>License</mat-header-cell>
            <mat-cell *matCellDef="let item" [matTooltip]="item.licenseId || ''" matTooltipPosition="above">
              {{ getLicenseName(item.licenseId) }}
            </mat-cell>
          </ng-container>

          <ng-container matColumnDef="distributorName">
            <mat-header-cell *matHeaderCellDef>Distributor Name</mat-header-cell>
            <mat-cell *matCellDef="let item">{{ item.distributorName || '—' }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="manufacturingUnit">
            <mat-header-cell *matHeaderCellDef>Manufacturing Unit</mat-header-cell>
            <mat-cell *matCellDef="let item">{{ item.manufacturingUnit || '—' }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="depoAddress">
            <mat-header-cell *matHeaderCellDef>Depot Address</mat-header-cell>
            <mat-cell *matCellDef="let item">{{ item.depoAddress || '—' }}</mat-cell>
          </ng-container>

          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
            <mat-cell *matCellDef="let item">
              <button matIconButton color="primary" (click)="onEdit(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(item)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>
        </mat-table>

        @if (rows.length === 0) {
          <div class="no-data">No distributor data found.</div>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
