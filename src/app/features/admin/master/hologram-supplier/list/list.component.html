<div class="container-fluid">
  <mat-card>
    <mat-card-header class="page-card-header">
      <div class="page-title">Hologram Supplier List</div>

      <!-- Button to open dialog for adding a new hologram supplier -->
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add Hologram Supplier
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="suppliers">

          <!-- Company Name Column -->
          <ng-container matColumnDef="companyName">
            <mat-header-cell *matHeaderCellDef>Company Name</mat-header-cell>
            <mat-cell *matCellDef="let item">{{ item.companyName }}</mat-cell>
          </ng-container>

          <!-- Post Column -->
          <ng-container matColumnDef="post">
            <mat-header-cell *matHeaderCellDef>Post</mat-header-cell>
            <mat-cell *matCellDef="let item">{{ item.post || '—' }}</mat-cell>
          </ng-container>

          <!-- Address Column -->
          <ng-container matColumnDef="address">
            <mat-header-cell *matHeaderCellDef>Address</mat-header-cell>
            <mat-cell *matCellDef="let item">{{ item.address || '—' }}</mat-cell>
          </ng-container>

          <!-- State Column -->
          <ng-container matColumnDef="state">
            <mat-header-cell *matHeaderCellDef>State</mat-header-cell>
            <mat-cell *matCellDef="let item">{{ item.state || '—' }}</mat-cell>
          </ng-container>

          <!-- Active Status Column -->
          <ng-container matColumnDef="isActive">
            <mat-header-cell *matHeaderCellDef>Active</mat-header-cell>
            <mat-cell *matCellDef="let item">
              @if (item.isActive) {
                <mat-icon style="color: green">check_circle</mat-icon>
              } @else {
                <mat-icon style="color: red">cancel</mat-icon>
              }
            </mat-cell>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
            <mat-cell *matCellDef="let item">
              <button matIconButton color="primary" (click)="onEdit(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(item)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

        </mat-table>

        @if (suppliers.length === 0) {
          <div class="no-data">No hologram suppliers found.</div>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
