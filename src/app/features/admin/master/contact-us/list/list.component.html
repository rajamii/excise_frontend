<div class="container-fluid">
  <mat-card>
    <mat-card-header>
      <div class="page-title">Contact Us - {{ activeCategory.label }}</div>
      <button matButton="filled" (click)="onAdd(activeCategory)">
        <mat-icon>add</mat-icon> Add {{ activeCategory.singularLabel }}
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="dataSource[activeCategory.key] || []">
          <ng-container *ngFor="let column of activeCategory.displayedColumns" [matColumnDef]="column">
            <mat-header-cell *matHeaderCellDef>{{ getColumnLabel(column) }}</mat-header-cell>

            <mat-cell *matCellDef="let contact">
              <ng-container *ngIf="column !== 'actions'; else actionsTemplate">
                {{ getColumnValue(contact, column) }}
              </ng-container>

              <ng-template #actionsTemplate>
                <button matIconButton color="primary" (click)="onEdit(activeCategory, contact)">
                  <mat-icon>edit</mat-icon>
                </button>
                <button matIconButton color="warn" (click)="onDelete(activeCategory, contact)">
                  <mat-icon>delete</mat-icon>
                </button>
              </ng-template>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="activeCategory.displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: activeCategory.displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
