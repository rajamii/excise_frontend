<div class="sbi-epay-container">
  <div class="payment-card mat-elevation-z6">
    <!-- Header bar matching the mockup -->
    <div class="card-header-bar">
      <span class="header-title">Payment Details</span>
      <button class="close-icon-btn" (click)="onBack()" title="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <!-- Card body -->
    <div class="card-body-content">
      <!-- Toggle buttons (Tabs) -->
      <div class="payment-tabs">
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'wallet'"
          (click)="selectTab('wallet')">
          Wallet Advance
        </button>
        <button 
          class="tab-btn" 
          [class.active]="activeTab === 'excise'"
          (click)="selectTab('excise')">
          Excise Duty
        </button>
      </div>

      <!-- Payment Fields Form -->
      <div class="payment-form-fields">
        <!-- Field 1: Transaction ID -->
        <div class="form-row">
          <div class="form-label-col">
            <label class="field-label">
              {{ activeTab === 'wallet' ? 'Wallet Transaction ID' : 'Excise Transaction ID' }} <span class="required-star">*</span>
            </label>
          </div>
          <div class="form-input-col">
            <div class="input-group-custom">
              <span class="input-addon">
                <mat-icon class="addon-icon">key</mat-icon>
              </span>
              <input 
                type="text" 
                class="form-control-custom read-only" 
                [value]="getCurrentTransactionId()" 
                readonly 
                tabindex="-1"
                aria-label="Transaction ID" />
            </div>
          </div>
        </div>

        <!-- Field 2: Head Of Account -->
        <div class="form-row">
          <div class="form-label-col">
            <label class="field-label">
              Head Of Account <span class="required-star">*</span>
            </label>
          </div>
          <div class="form-input-col">
            <div class="input-group-custom">
              <span class="input-addon">
                <mat-icon class="addon-icon info-icon">info</mat-icon>
              </span>
              <input 
                type="text" 
                class="form-control-custom read-only" 
                [value]="getCurrentHeadOfAccount()" 
                readonly 
                tabindex="-1"
                aria-label="Head Of Account" />
            </div>
          </div>
        </div>

        <!-- Field 3: Amount -->
        <div class="form-row">
          <div class="form-label-col">
            <label class="field-label">
              Amount <span class="required-star">*</span>
            </label>
          </div>
          <div class="form-input-col">
            <div class="input-group-custom amount-group">
              <span class="input-addon text-addon">Rs</span>
              <input 
                type="number" 
                class="form-control-custom editable" 
                [(ngModel)]="amount" 
                placeholder="0" 
                min="0"
                aria-label="Amount" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Divider and Footer Buttons -->
    <div class="card-footer-divider"></div>
    <div class="card-footer-actions">
      <button class="action-btn btn-proceed" (click)="onProceed()">
        Proceed To Payment
      </button>
      <button class="action-btn btn-back" (click)="onBack()">
        Back
      </button>
    </div>
  </div>
</div>
