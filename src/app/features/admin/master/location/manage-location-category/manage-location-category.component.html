<div class="container-fluid p-0">
  <h2 mat-dialog-title align="center">
    {{ isEditMode ? 'Edit' : 'Add' }} Location Category
  </h2>

  <mat-dialog-content class="manage-form">
    <!-- Category Name -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Category Name</mat-label>
      <input
        matInput
        [(ngModel)]="categoryRecord.categoryName"
        required
        placeholder="e.g. Municipal Area"
      />
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        [(ngModel)]="categoryRecord.description"
        rows="3"
        placeholder="Optional description"
      ></textarea>
    </mat-form-field>

    <!-- Active Status -->
    <div class="mt-2 mb-2">
      <mat-checkbox [(ngModel)]="categoryRecord.isActive">
        Active
      </mat-checkbox>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button matButton="filled" color="primary" (click)="onSave()">Save</button>
    <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
  </mat-dialog-actions>
</div>
