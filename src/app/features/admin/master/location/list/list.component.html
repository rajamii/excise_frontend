<div class="container-fluid">
  <mat-card>
    <mat-card-header>
      <div class="page-title">Locations</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add Location
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="locations">

          <!-- Location Code -->
          <ng-container matColumnDef="locationCode">
            <mat-header-cell *matHeaderCellDef> Location Code </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ item.locationCode }} </mat-cell>
          </ng-container>

          <!-- Description -->
          <ng-container matColumnDef="locationDescription">
            <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ item.locationDescription }} </mat-cell>
          </ng-container>

          <!-- District -->
          <ng-container matColumnDef="district">
            <mat-header-cell *matHeaderCellDef> District </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ item.district }} </mat-cell>
          </ng-container>

          <!-- Status -->
          <ng-container matColumnDef="status">
            <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <span class="status-badge" [class.active]="item.isActive" [class.inactive]="!item.isActive">
                {{ item.isActive ? 'Active' : 'Inactive' }}
              </span>
            </mat-cell>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <button matIconButton color="primary" (click)="onEdit(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(item)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
