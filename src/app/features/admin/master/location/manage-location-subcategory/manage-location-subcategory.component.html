<div class="container-fluid p-0">
  <h2 mat-dialog-title align="center">
    {{ isEditMode ? 'Edit' : 'Add' }} Location Subcategory
  </h2>

  <mat-dialog-content class="manage-form">
    <!-- Subcategory Name -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Subcategory Name</mat-label>
      <input
        matInput
        [(ngModel)]="subcategoryRecord.subcategoryName"
        required
        placeholder="e.g. Nagar Panchayat"
      />
    </mat-form-field>

    <!-- Location Category Selection -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Location Category</mat-label>
      <mat-select [(ngModel)]="subcategoryRecord.categoryId" required>
        @if (categories.length === 0) {
          <mat-option disabled>No categories available</mat-option>
        }
        @for (category of categories; track category.id) {
          <mat-option [value]="category.id">
            {{ category.categoryName }}
          </mat-option>
        }
      </mat-select>
    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        [(ngModel)]="subcategoryRecord.description"
        rows="3"
        placeholder="Optional description"
      ></textarea>
    </mat-form-field>

    <!-- Active Status -->
    <div class="mt-2 mb-2">
      <mat-checkbox [(ngModel)]="subcategoryRecord.isActive">
        Active
      </mat-checkbox>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button matButton="filled" color="primary" (click)="onSave()">Save</button>
    <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
  </mat-dialog-actions>
</div>
