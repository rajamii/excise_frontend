<div class="container-fluid">
  <mat-card>
    <mat-card-header class="page-card-header">
      <div class="page-title">License Type List</div>

      <!-- Button to open dialog for adding a new license type -->
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add License Type
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="licenseTypes">

          <!-- License Type Name Column -->
          <ng-container matColumnDef="licenseType">
            <mat-header-cell *matHeaderCellDef> License Type </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ item.licenseType }} </mat-cell>
          </ng-container>

          <!-- Action Buttons Column -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <!-- Edit license type -->
              <button matIconButton color="primary" (click)="onEdit(item)">
                <mat-icon>edit</mat-icon>
              </button>

              <!-- Delete license type -->
              <button matIconButton color="warn" (click)="onDelete(item)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <!-- Header and row definitions -->
          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
