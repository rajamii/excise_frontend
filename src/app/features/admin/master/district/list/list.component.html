<div class="container-fluid">
  <mat-card>

    <!-- Header: Title and Add button -->
    <mat-card-header class="page-card-header">
      <div class="page-title">District List</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add District
      </button>
    </mat-card-header>

    <!-- Content: Table of districts -->
    <mat-card-content class="page-card-content">
      <div class="table-container">
        <mat-table [dataSource]="districtDataSource">

          <!-- ID -->
          <ng-container matColumnDef="id">
            <mat-header-cell *matHeaderCellDef>Id</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ element.id }}</mat-cell>
          </ng-container>

          <!-- District Name -->
          <ng-container matColumnDef="district">
            <mat-header-cell *matHeaderCellDef>District</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ element.district }}</mat-cell>
          </ng-container>

          <!-- District Code -->
          <ng-container matColumnDef="districtCode">
            <mat-header-cell *matHeaderCellDef>District Code</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ element.districtCode }}</mat-cell>
          </ng-container>

          <!-- State Name -->
          <ng-container matColumnDef="state">
            <mat-header-cell *matHeaderCellDef>State</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ element.state }}</mat-cell>
          </ng-container>

          <!-- State Code -->
          <ng-container matColumnDef="stateCode">
            <mat-header-cell *matHeaderCellDef>State Code</mat-header-cell>
            <mat-cell *matCellDef="let element">{{ element.stateCode }}</mat-cell>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
            <mat-cell *matCellDef="let element">
              <button matIconButton color="primary" (click)="onEdit(element)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <!-- Table rows -->
          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
