<div class="container-fluid">
  <h2 mat-dialog-title align="center">
    {{ isEditMode ? 'Edit' : 'Add' }} District
  </h2>

  <form #form="ngForm">
    <mat-dialog-content>

      <!-- District Name -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>District Name</mat-label>
        <input
          matInput
          name="district"
          required
          [(ngModel)]="district.district"
          #districtModel="ngModel"
        />
        <mat-error *ngIf="districtModel.errors?.['required']">
          District name is required
        </mat-error>
      </mat-form-field>

      <!-- District Code -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>District Code</mat-label>
        <input
          matInput
          type="number"
          name="districtCode"
          required
          [(ngModel)]="district.districtCode"
          #districtCodeModel="ngModel"
        />
        <mat-error *ngIf="districtCodeModel.errors?.['required']">
          District code is required
        </mat-error>
      </mat-form-field>

      <!-- State Selection -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>State</mat-label>
        <mat-select
          [(ngModel)]="district.stateCode"
          name="stateCode"
          required
          #stateModel="ngModel"
        >
          <mat-option *ngFor="let s of states" [value]="s.stateCode">
            {{ s.state }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="stateModel.errors?.['required']">
          State is required
        </mat-error>
      </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions align="center">
      <button matButton="filled" color="primary" (click)="onSave()" [disabled]="form.invalid">Save</button>
      <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
    </mat-dialog-actions>
  </form>
</div>
