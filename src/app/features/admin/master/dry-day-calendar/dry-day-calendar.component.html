<div class="calendar-container">

  <!-- ─── Header Card ───────────────────────────────────── -->
  <mat-card class="header-card">
    <div class="header-inner">
      <div class="header-title-section">
        <div class="header-icon-wrap">
          <mat-icon>event</mat-icon>
        </div>
        <div>
          <h1 class="header-title">Dry Day Calendar</h1>
          <p class="header-subtitle">Configure allowed dry day dates for each calendar year.</p>
        </div>
      </div>

      <div class="header-actions">
        <!-- Year Select -->
        <div class="select-wrapper">
          <label class="select-label">Year</label>
          <div class="select-controls">
            <select [(ngModel)]="financialYear" (ngModelChange)="onYearChange()" class="year-select">
              <option *ngFor="let year of availableYears" [value]="year">{{ year }}</option>
            </select>
            <button mat-icon-button (click)="addNewYear()" class="add-year-btn" matTooltip="Add Year">
              <mat-icon>add_circle</mat-icon>
            </button>
          </div>
        </div>

        <!-- Stats Badge -->
        <div class="stats-card">
          <span class="stats-label">Dry Days Set</span>
          <span class="stats-value">{{ allowedDates.size }}</span>
        </div>

        <!-- Save Button -->
        <button mat-flat-button class="save-btn" (click)="saveCalendar()" [disabled]="isLoading">
          <mat-icon *ngIf="!isLoading">save</mat-icon>
          <span>{{ isLoading ? 'Saving...' : 'Save Configuration' }}</span>
        </button>
      </div>
    </div>
  </mat-card>

  <!-- ─── 12-Month Grid ─────────────────────────────────── -->
  <div class="months-grid" *ngIf="!isLoading; else loadingState">
    <mat-card class="month-card" *ngFor="let month of months">

      <!-- Month Header -->
      <div class="month-header">
        <span class="month-name">{{ month.name }}</span>
        <span class="month-year">{{ month.year }}</span>
      </div>

      <!-- Weekday Labels -->
      <div class="weekdays-grid">
        <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
      </div>

      <!-- Day Cells -->
      <div class="days-grid">
        <ng-container *ngFor="let day of month.days">
          <div class="day-cell pad" *ngIf="!day.dayNumber"></div>
          <button
            *ngIf="day.dayNumber"
            class="day-cell day-btn"
            [class.is-dry]="day.isDryDay"
            (click)="toggleDay(day)"
            [title]="day.dateStr">
            {{ day.dayNumber }}
          </button>
        </ng-container>
      </div>

    </mat-card>
  </div>

  <!-- ─── Loading State ─────────────────────────────────── -->
  <ng-template #loadingState>
    <div class="loading-wrapper">
      <div class="loader"></div>
      <p class="loading-text">Loading Calendar...</p>
    </div>
  </ng-template>

</div>
