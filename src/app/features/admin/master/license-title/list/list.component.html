<div class="container-fluid">
  <mat-card>
    <mat-card-header>
      <div class="page-title">License Titles</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add Title
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="licenseTitles">

          <!-- Description -->
          <ng-container matColumnDef="description">
            <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
            <mat-cell *matCellDef="let title"> {{ title.description }} </mat-cell>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let title">
              <button matIconButton color="primary" (click)="onEdit(title)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(title)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
