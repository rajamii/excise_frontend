<div class="container-fluid">
  <h2 mat-dialog-title align="center">
    {{ isEditMode ? 'Edit' : 'Add' }} {{ data.category.singularLabel }}
  </h2>

  <form #form="ngForm">
    <mat-dialog-content>
      <ng-container *ngFor="let field of data.category.fields">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>{{ field.label }}</mat-label>

          <ng-container *ngIf="field.type === 'file'; else textInput">
            <input
              matInput
              readonly
              [value]="getFileDisplayValue(field)"
              [name]="field.key + 'Display'"
              [required]="isFieldRequired(field)"
              [attr.aria-label]="field.label"
              title="{{ field.label }}"
              placeholder="{{ field.label }}"
              (click)="fileInput.click()"
            />
            <input
              hidden
              type="file"
              accept="image/*"
              #fileInput
              [name]="field.key"
              (change)="onFileSelected($event, field)"
            />
          </ng-container>

          <ng-template #textInput>
            <ng-container *ngIf="field.type === 'textarea'; else basicInput">
              <div class="formatting-toolbar">
                <button type="button" mat-icon-button (click)="makeBold(field.key)" title="Bold Text">
                  <mat-icon>format_bold</mat-icon>
                </button>
              </div>
              <textarea
                matInput
                rows="10"
                [(ngModel)]="$any(record)[field.key]"
                [name]="field.key"
                [required]="!!field.required"
                [attr.aria-label]="field.label"
                title="{{ field.label }}"
                placeholder="{{ field.label }}"
                id="textarea-{{ field.key }}"
              ></textarea>
            </ng-container>
            <ng-template #basicInput>
              <input
                matInput
                [type]="field.type || 'text'"
                [(ngModel)]="$any(record)[field.key]"
                [name]="field.key"
                [required]="!!field.required"
                [attr.aria-label]="field.label"
                title="{{ field.label }}"
                placeholder="{{ field.label }}"
                [email]="field.type === 'email'"
              />
            </ng-template>
          </ng-template>

          <mat-error *ngIf="form.controls[field.key]?.errors?.['required']">
            {{ field.label }} is required
          </mat-error>
          <mat-error *ngIf="form.controls[field.key]?.errors?.['email']">
            Enter a valid email address
          </mat-error>
        </mat-form-field>
      </ng-container>
    </mat-dialog-content>

    <mat-dialog-actions align="center">
      <button type="button" class="dialog-btn dialog-btn--save" (click)="onSave()" [disabled]="form.invalid">
        <mat-icon>save</mat-icon>
        Save
      </button>
      <button type="button" class="dialog-btn dialog-btn--cancel" (click)="onCancel()">
        <mat-icon>close</mat-icon>
        Cancel
      </button>
    </mat-dialog-actions>
  </form>
</div>
