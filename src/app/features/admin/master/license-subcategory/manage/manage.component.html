<div class="container-fluid">
  <!-- Dialog heading based on mode -->
  <h2 mat-dialog-title align="center">{{ isEditMode ? 'Edit' : 'Add' }} License Subcategory</h2>

  <form #form="ngForm">
    <mat-dialog-content>

      <!-- Subcategory description input -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Description</mat-label>
        <input
          matInput
          name="description"
          required
          [(ngModel)]="licenseSubcategory.description"
          #descriptionModel="ngModel"
        />
        <mat-error *ngIf="descriptionModel.errors?.['required']">
          Description is required
        </mat-error>
      </mat-form-field>

      <!-- Category selection (dropdown) -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>License Category</mat-label>
        <mat-select
          [(ngModel)]="licenseSubcategory.category"
          name="category"
          required
        >
          <!-- Bind category list to dropdown -->
          <mat-option *ngFor="let cat of categories" [value]="cat.id">
            {{ cat.licenseCategory }}
          </mat-option>
        </mat-select>
      </mat-form-field>

    </mat-dialog-content>

    <!-- Action buttons -->
    <mat-dialog-actions align="center">
      <!-- Save button disabled if form is invalid -->
      <button matButton="filled" color="primary" (click)="onSave()" [disabled]="form.invalid">Save</button>
      <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
    </mat-dialog-actions>
  </form>
</div>
