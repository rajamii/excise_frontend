<div class="dialog-container">
  <h2 mat-dialog-title class="dialog-title">
    <mat-icon class="dialog-title-icon">subdirectory_arrow_right</mat-icon>
    {{ isEditMode ? 'Edit' : 'Add' }} License Subcategory
  </h2>

  <form #form="ngForm">
    <mat-dialog-content class="dialog-content">

      <!-- License Category Dropdown -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>License Category</mat-label>
        <mat-icon matPrefix class="field-prefix-icon">list_alt</mat-icon>
        <mat-select
          name="category"
          [(ngModel)]="licenseSubcategory.category"
          required
          #categoryModel="ngModel"
        >
          <mat-option *ngFor="let cat of licenseCategories" [value]="cat.id">
            {{ cat.licenseCategory }}
          </mat-option>
        </mat-select>
        <mat-error *ngIf="categoryModel.errors?.['required']">
          Category is required
        </mat-error>
      </mat-form-field>

      <!-- Description Input -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Description</mat-label>
        <mat-icon matPrefix class="field-prefix-icon">description</mat-icon>
        <input
          matInput
          name="description"
          [(ngModel)]="licenseSubcategory.description"
          required
          placeholder="Enter subcategory description"
          #descriptionModel="ngModel"
        />
        <mat-error *ngIf="descriptionModel.errors?.['required']">
          Description is required
        </mat-error>
      </mat-form-field>

    </mat-dialog-content>

    <mat-dialog-actions class="dialog-actions">
      <button mat-stroked-button class="btn-cancel" (click)="onCancel()">
        Cancel
      </button>
      <button mat-flat-button color="primary" class="btn-save" (click)="onSave()" [disabled]="form.invalid">
        <mat-icon>save</mat-icon>
        {{ isEditMode ? 'Update' : 'Save' }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
