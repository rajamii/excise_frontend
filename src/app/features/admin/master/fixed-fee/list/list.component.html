<div class="container-fluid">
  <mat-card>

    <mat-card-header class="page-card-header">
      <div class="page-title" style="width:100%; text-align:center;">Service & Fixed Fees Configurations</div>
    </mat-card-header>

    <mat-card-content class="page-card-content">
      <div class="table-container">
        <mat-table [dataSource]="fixedFees">

          <!-- Fee Code -->
          <ng-container matColumnDef="feeCode">
            <mat-header-cell *matHeaderCellDef> Fee Code </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ item.feeCode }} </mat-cell>
          </ng-container>

          <!-- Description -->
          <ng-container matColumnDef="feeDesc">
            <mat-header-cell *matHeaderCellDef> Description </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ item.feeDesc }} </mat-cell>
          </ng-container>

          <!-- Amount -->
          <ng-container matColumnDef="amount">
            <mat-header-cell *matHeaderCellDef> Amount </mat-header-cell>
            <mat-cell *matCellDef="let item">
              {{ item.amount !== null && item.amount !== undefined ? (item.amount | currency:'INR':'symbol':'1.2-2') : 'N/A' }}
            </mat-cell>
          </ng-container>

          <!-- Status -->
          <ng-container matColumnDef="status">
            <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <span class="status-badge" [class.active]="item.isActive" [class.inactive]="!item.isActive">
                {{ item.isActive ? 'Active' : 'Inactive' }}
              </span>
            </mat-cell>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <button matIconButton color="primary" (click)="onEdit(item)" matTooltip="Edit Amount">
                <mat-icon>edit</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
