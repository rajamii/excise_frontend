<div class="container-fluid p-0">
  <h2 mat-dialog-title align="center">
    Update Service Fee Amount
  </h2>

  <mat-dialog-content class="manage-form">
    <!-- Fee Code (Disabled) -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Fee Code</mat-label>
      <input
        matInput
        [(ngModel)]="feeRecord.feeCode"
        [disabled]="true"
        placeholder="Fee Code"
      />
    </mat-form-field>

    <!-- Description (Disabled) -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Description</mat-label>
      <input
        matInput
        [(ngModel)]="feeRecord.feeDesc"
        [disabled]="true"
        placeholder="Description"
      />
    </mat-form-field>

    <!-- Amount -->
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Amount (₹)</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="feeRecord.amount"
        required
        placeholder="e.g. 3000.00"
      />
    </mat-form-field>

    <!-- Active Status -->
    <div class="mt-2 mb-2">
      <mat-checkbox [(ngModel)]="feeRecord.isActive">
        Active
      </mat-checkbox>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button matButton="filled" color="primary" (click)="onSave()">Save</button>
    <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
  </mat-dialog-actions>
</div>
