<div class="container-fluid">
  <mat-card>
    <mat-card-header>
      <div class="page-title">License Categories</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add Category
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="licenseCategories">

          <!-- License Category Column -->
          <ng-container matColumnDef="licenseCategory">
            <mat-header-cell *matHeaderCellDef> Category </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <span class="category-name">{{ item.licenseCategory }}</span>
            </mat-cell>
          </ng-container>

          <!-- Special Permit Column -->
          <ng-container matColumnDef="specialPermit">
            <mat-header-cell *matHeaderCellDef>
              <div style="display:flex;align-items:center;gap:6px;">
                <mat-icon style="font-size:16px;width:16px;height:16px;">assignment_turned_in</mat-icon>
                Special Permit
              </div>
            </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <span *ngIf="item.isSpecialPermitAllowed" class="badge badge-allowed">
                <mat-icon>check_circle</mat-icon> Allowed
              </span>
              <span *ngIf="!item.isSpecialPermitAllowed" class="badge badge-not-allowed">
                <mat-icon>remove_circle_outline</mat-icon> Not Allowed
              </span>
            </mat-cell>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <button matIconButton color="primary" matTooltip="Edit" (click)="onEdit(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" matTooltip="Delete" (click)="onDelete(item)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
