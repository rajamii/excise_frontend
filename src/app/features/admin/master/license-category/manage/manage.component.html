<div class="dialog-wrapper">
  <!-- Dialog Title -->
  <div class="dialog-header">
    <mat-icon>category</mat-icon>
    <h2>{{ isEditMode ? 'Edit' : 'Add' }} License Category</h2>
  </div>

  <form #form="ngForm">
    <mat-dialog-content>

      <!-- License Category Name -->
      <mat-form-field appearance="outline" subscriptSizing="dynamic" style="width:100%;">
        <mat-label>Category Name</mat-label>
        <mat-icon matPrefix style="margin-right:8px;color:#1C2B78;">label</mat-icon>
        <input
          matInput
          name="licenseCategory"
          [(ngModel)]="licenseCategory.licenseCategory"
          placeholder="Enter category name"
          required
          #licenseCategoryModel="ngModel"
        />
        <mat-error *ngIf="licenseCategoryModel.errors?.['required']">
          Category name is required
        </mat-error>
      </mat-form-field>

      <!-- Special Permit Toggle Card -->
      <div class="permit-toggle-card" [class.permit-active]="licenseCategory.isSpecialPermitAllowed">
        <div class="permit-toggle-left">
          <div class="permit-icon" [class.permit-icon-active]="licenseCategory.isSpecialPermitAllowed">
            <mat-icon>assignment_turned_in</mat-icon>
          </div>
          <div class="permit-text">
            <span class="permit-title">Allow Special Permit</span>
            <span class="permit-subtitle">
              Licensees of this category can view &amp; submit Special Permit (Dry Day) applications
            </span>
          </div>
        </div>
        <mat-slide-toggle
          name="isSpecialPermitAllowed"
          [(ngModel)]="licenseCategory.isSpecialPermitAllowed"
          color="primary">
        </mat-slide-toggle>
      </div>

    </mat-dialog-content>

    <mat-dialog-actions align="end" style="padding: 12px 24px; gap: 10px;">
      <button mat-stroked-button (click)="onCancel()">Cancel</button>
      <button mat-flat-button color="primary" (click)="onSave()" [disabled]="form.invalid">
        <mat-icon>save</mat-icon> Save
      </button>
    </mat-dialog-actions>
  </form>
</div>
