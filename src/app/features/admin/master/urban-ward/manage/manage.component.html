<div class="container-fluid p-0">
  <h2 mat-dialog-title align="center">
    {{ isEditMode ? 'Edit' : 'Add' }} Ward
  </h2>

  <mat-dialog-content class="manage-form">
    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Ward Name</mat-label>
      <input
        matInput
        [(ngModel)]="ward.wardName"
        required
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Ward Number</mat-label>
      <input
        type="number"
        matInput
        [(ngModel)]="ward.wardNumber"
        required
      />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mt-2">
      <mat-label>Location</mat-label>
      <mat-select [(ngModel)]="ward.locationCode" required>
        <mat-option *ngFor="let loc of locations" [value]="loc.locationCode">
          {{ loc.locationDescription }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="mt-2 mb-2">
      <mat-checkbox [(ngModel)]="ward.isActive">
        Active
      </mat-checkbox>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="center">
    <button matButton="filled" color="primary" (click)="onSave()">Save</button>
    <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
  </mat-dialog-actions>
</div>
