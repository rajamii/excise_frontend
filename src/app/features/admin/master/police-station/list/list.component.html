<div class="container-fluid">
  <mat-card>

    <mat-card-header>
      <div class="page-title">Police Stations</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add Police Station
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="filter-container">
        <mat-form-field appearance="outline">
          <mat-label>Select Subdivision</mat-label>
          <!-- Dropdown to filter police stations by subdivision -->
          <mat-select [(ngModel)]="selectedSubdivisionCode" (selectionChange)="onSubdivisionSelect()">
            <mat-option [value]="null">All Subdivisions</mat-option>
            @for (sub of subdivisions; track sub) {
              <mat-option [value]="sub.subdivisionCode">
                {{ sub.subdivision }}
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
      </div>

      <div class="table-container">
        <!-- Material table bound to policeStations array -->
        <mat-table [dataSource]="policeStations">

          <!-- Table column: Police Station Name -->
          <ng-container matColumnDef="policeStation">
            <mat-header-cell *matHeaderCellDef> Police Station </mat-header-cell>
            <mat-cell *matCellDef="let row"> {{ row.policeStation }} </mat-cell>
          </ng-container>

          <!-- Table column: Police Station Code -->
          <ng-container matColumnDef="policeStationCode">
            <mat-header-cell *matHeaderCellDef> Police Station Code </mat-header-cell>
            <mat-cell *matCellDef="let row"> {{ row.policeStationCode }} </mat-cell>
          </ng-container>

          <!-- Table column: Subdivision Name -->
          <ng-container matColumnDef="subdivision">
            <mat-header-cell *matHeaderCellDef> Subdivision </mat-header-cell>
            <mat-cell *matCellDef="let row"> {{ row.subdivision }} </mat-cell>
          </ng-container>

          <!-- Table column: Action buttons -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let row">
              <button matIconButton color="primary" (click)="onEdit(row)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(row)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <!-- Header and row definitions -->
          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
