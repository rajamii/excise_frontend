<div class="container-fluid">
  <mat-card>
    <mat-card-header>
      <div class="page-title">Additional Charges Configurations</div>
      <button matButton="filled" (click)="onAdd()">
        <mat-icon>add</mat-icon> Add Configuration
      </button>
    </mat-card-header>

    <mat-card-content>
      <div class="table-container">
        <mat-table [dataSource]="configs">

          <!-- Category -->
          <ng-container matColumnDef="categoryName">
            <mat-header-cell *matHeaderCellDef> License Category </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ item.categoryName }} </mat-cell>
          </ng-container>
 
          <!-- Charge Type -->
          <ng-container matColumnDef="chargeType">
            <mat-header-cell *matHeaderCellDef> Charge Type </mat-header-cell>
            <mat-cell *matCellDef="let item"> {{ getChargeTypeDisplay(item.chargeType) }} </mat-cell>
          </ng-container>
 

 
          <!-- Is Active -->
          <ng-container matColumnDef="isActive">
            <mat-header-cell *matHeaderCellDef> Status </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <span class="status-badge" [class.active]="item.isActive" [class.inactive]="!item.isActive">
                {{ item.isActive ? 'Active' : 'Inactive' }}
              </span>
            </mat-cell>
          </ng-container>

          <!-- Actions -->
          <ng-container matColumnDef="actions">
            <mat-header-cell *matHeaderCellDef> Actions </mat-header-cell>
            <mat-cell *matCellDef="let item">
              <button matIconButton color="primary" (click)="onEdit(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button matIconButton color="warn" (click)="onDelete(item)">
                <mat-icon>delete</mat-icon>
              </button>
            </mat-cell>
          </ng-container>

          <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
          <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
        </mat-table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
