<div class="container-fluid">
  <!-- Title of the dialog to edit the license type -->
  <h2 mat-dialog-title>Add License Type</h2>

  <form #newLicenseTypeForm="ngForm">
    <mat-dialog-content>
      <!-- License Type Name input field -->
      <mat-form-field appearance="outline" class="w-full">
        <mat-label>License Type Name</mat-label>
        <input
          matInput
          [(ngModel)]="licenseType.licenseType"
          name="licenseTypeName"
          #licenseTypeName="ngModel"
          placeholder="Enter License Type Name"
          maxlength="150"
          minlength="3"
          required
        />
      </mat-form-field>

      <!-- Error message -->
      @if ((licenseTypeName.dirty || licenseTypeName.touched) && licenseTypeName.invalid){
        <div>
          @if (licenseTypeName.errors?.['required']) {
            <mat-error>
              <small>This field is required.</small>
            </mat-error>
          }
        </div>
      }
    </mat-dialog-content>

      <!-- Buttons -->
      <mat-dialog-actions>
        <button matButton="filled" color="primary" (click)="onSave()" [disabled]="newLicenseTypeForm.invalid">Save</button>
        <button matButton="filled" color="warn" (click)="onCancel()">Cancel</button>
      </mat-dialog-actions>
  </form>
</div>
