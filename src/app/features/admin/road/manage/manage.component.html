<div class="container-fluid">
  <h2 mat-dialog-title>{{ isEditMode ? 'Edit' : 'Add' }} Road</h2>

  <form class="mt-3" #form="ngForm">
    <mat-dialog-content>

      <!-- Road Name -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Road Name</mat-label>
        <input
          matInput
          name="roadName"
          required
          [(ngModel)]="road.roadName"
        />
      </mat-form-field>

      <!-- Road Type -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>Road Type</mat-label>
        <mat-select [(ngModel)]="road.roadType" name="roadType" required>
          <mat-option *ngFor="let type of roadTypes" [value]="type.value">
            {{ type.label }}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <!-- District -->
      <mat-form-field appearance="outline" class="w-100">
        <mat-label>District</mat-label>
        <mat-select [(ngModel)]="road.district" name="district" required>
          <mat-option *ngFor="let d of districts" [value]="d.id">
            {{ d.district }}
          </mat-option>
        </mat-select>
      </mat-form-field>

    </mat-dialog-content>

    <!-- Actions -->
    <mat-dialog-actions align="center">
      <button mat-raised-button color="primary" (click)="onSave()">Save</button>
      <button mat-raised-button color="warn" (click)="onCancel()">Cancel</button>
    </mat-dialog-actions>
  </form>
</div>
