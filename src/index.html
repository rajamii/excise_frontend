<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Excise Department</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/icons/fav-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- BillDesk Web SDK UAT Scripts -->
  <script type="module" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.esm.js" integrity="sha384-1Q8KBM+KmoK6Qfw0wUZZF7q7rYs39uyYc7glrCqubCJKhD+Suuq2qQlx5bTxsu2l" crossorigin="anonymous"></script>
  <script nomodule="" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk.js" integrity="sha384-S4BCy+/d7Ml5VOzeI02RAEwvAQF7pCvc8wI20pJypKEF5EaZIwasj/k29T7BtDhU" crossorigin="anonymous"></script>
  <link href="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.css" rel="stylesheet" integrity="sha384-59jymxHgzovZrxQCBAn+cjiL8jUHwlLh9zPc0jyEBrLsYKX1IQkQl3ejglkaQ4bP" crossorigin="anonymous">
</head>

<body>
  <!-- Pre-bootstrap loader (shows before Angular renders) -->
  <style>
    #app-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.96);
      font-family: Roboto, Arial, sans-serif;
      opacity: 1;
      transition: opacity 220ms ease, visibility 220ms ease;
      transform: translateZ(0);
    }

    #app-preloader.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-preloader .card-outer {
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 106, 0, 0.55), rgba(28, 43, 120, 0.28));
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.14);
    }

    #app-preloader .card {
      width: min(420px, calc(100vw - 48px));
      border-radius: 17px;
      padding: 30px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: #ffffff;
    }

    #app-preloader .glass-wrap {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      position: relative;
      contain: layout paint;
    }

    #app-preloader .loader-ring {
      position: absolute;
      inset: 3px;
      border: 3px solid rgba(28, 43, 120, 0.14);
      border-top-color: #ff6a00;
      border-right-color: rgba(255, 106, 0, 0.72);
      border-radius: 50%;
      animation: loaderSpin 1s linear infinite;
      will-change: transform;
    }

    #app-preloader .loader-ring::after {
      content: '';
      position: absolute;
      width: 9px;
      height: 9px;
      top: 1px;
      left: 50%;
      border-radius: 50%;
      background: #ff6a00;
      transform: translateX(-50%);
      box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.12);
    }

    #app-preloader .glass-icon {
      width: 34px;
      height: 46px;
      position: relative;
      border: 2px solid rgba(28, 43, 120, 0.42);
      border-top-width: 3px;
      border-radius: 7px 7px 11px 11px;
      background:
        linear-gradient(to top, rgba(255, 138, 0, 0.9) 0 45%, transparent 45%),
        linear-gradient(135deg, rgba(28, 43, 120, 0.08), rgba(255, 255, 255, 0.92));
      box-shadow: 0 8px 18px rgba(2, 6, 23, 0.10);
    }

    #app-preloader .glass-icon::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 2px;
      left: 4px;
      bottom: -8px;
      border-radius: 999px;
      background: rgba(28, 43, 120, 0.32);
    }

    #app-preloader .title {
      font-size: 15px;
      font-weight: 600;
      color: #1c2b78;
      letter-spacing: 0.3px;
    }

    #app-preloader .sub {
      font-size: 12px;
      color: rgba(2, 6, 23, 0.60);
      letter-spacing: 0.2px;
    }

    @keyframes loaderSpin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <div id="app-preloader" aria-live="polite" aria-busy="true">
    <div class="card-outer">
      <div class="card">
        <div class="glass-wrap" aria-hidden="true">
          <div class="loader-ring"></div>
          <div class="glass-icon"></div>
        </div>
        <div class="title">Loading...</div>
        <div class="sub">Please wait</div>
      </div>
    </div>
  </div>

  <app-root></app-root>
</body>

</html>
