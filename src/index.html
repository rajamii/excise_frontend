<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Excise Department</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/icons/fav-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- BillDesk Web SDK UAT Scripts -->
   <script type="module" src="https://uat1.billdesk.com/u2/web/v1_2/sdk"></script>
  <script type="module" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.esm.js"></script>
  <script nomodule="" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk.js"></script>
  <link href="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.css" rel="stylesheet">
</head>

<body>
  <!-- Pre-bootstrap loader (shows before Angular renders) -->
  <style>
    #app-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 145, 77, 0.16), transparent 34%),
        radial-gradient(circle at 84% 82%, rgba(29, 78, 216, 0.12), transparent 36%),
        #f8fafc;
      font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif;
      opacity: 1;
      transition: opacity 220ms ease, visibility 220ms ease;
      transform: translateZ(0);
    }

    #app-preloader.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-preloader .card-outer {
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 106, 0, 0.55), rgba(28, 43, 120, 0.28));
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.14);
    }

    #app-preloader .card {
      width: min(390px, calc(100vw - 40px));
      border-radius: 17px;
      padding: 26px 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: #ffffff;
    }

    #app-preloader .loader-emblem {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      position: relative;
      contain: layout paint;
    }

    #app-preloader .loader-ring {
      position: absolute;
      inset: 3px;
      border: 3px solid rgba(28, 43, 120, 0.14);
      border-radius: 999px;
      border-top-color: #ff6a00;
      border-right-color: rgba(255, 106, 0, 0.72);
      animation: loaderSpin 1s linear infinite;
      will-change: transform;
    }

    #app-preloader .loader-ring::after {
      content: '';
      position: absolute;
      width: 9px;
      height: 9px;
      top: 1px;
      left: 50%;
      border-radius: 50%;
      background: #ff6a00;
      transform: translateX(-50%);
      box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.12);
    }

    #app-preloader .shield-icon {
      width: 42px;
      height: 48px;
      filter: drop-shadow(0 7px 12px rgba(28, 43, 120, 0.16));
    }

    #app-preloader .title {
      font-size: 15px;
      font-weight: 600;
      color: #1c2b78;
      letter-spacing: 0.3px;
    }

    #app-preloader .sub {
      font-size: 12px;
      color: rgba(2, 6, 23, 0.60);
      letter-spacing: 0.2px;
    }

    #app-preloader .progress-track {
      width: min(190px, 68vw);
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(28, 43, 120, 0.12);
      margin-top: -3px;
    }

    #app-preloader .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff8a00, #ff5e00, #1c2b78);
      transition: width 220ms ease-out;
    }

    @keyframes loaderSpin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>

  <div id="app-preloader" aria-live="polite" aria-busy="true">
    <div class="card-outer">
      <div class="card">
        <div class="loader-emblem" aria-hidden="true">
          <div class="loader-ring"></div>
          <svg class="shield-icon" viewBox="0 0 48 54" xmlns="http://www.w3.org/2000/svg">
            <path d="M24 3 42 10v13.1C42 35.7 34.8 45.7 24 51 13.2 45.7 6 35.7 6 23.1V10L24 3Z" fill="#f8fafc" stroke="#1c2b78" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="m14.8 26.4 5.7 5.7 12.7-13" fill="none" stroke="#ff7a00" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 6.2v38.9" stroke="#1c2b78" stroke-width="1.2" opacity=".12"/>
          </svg>
        </div>
        <div class="title">Loading...</div>
        <div class="sub">Please wait</div>
        <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="app-preloader-progress"></div></div>
      </div>
    </div>
  </div>

  <script>
    // The browser does not expose exact Angular download progress. This gives
    // users a truthful, forward-only startup indicator up to 90%; main.ts
    // completes it at 100% when Angular has bootstrapped.
    (function () {
      var progress = document.getElementById('app-preloader-progress');
      if (!progress || !window.requestAnimationFrame) return;
      var startedAt = performance.now();
      function advance(now) {
        var elapsed = now - startedAt;
        var value = 90 * (1 - Math.exp(-elapsed / 1100));
        progress.style.width = Math.min(value, 90).toFixed(1) + '%';
        window.requestAnimationFrame(advance);
      }
      window.requestAnimationFrame(advance);
    }());
  </script>

  <app-root></app-root>
</body>

</html>
