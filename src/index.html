<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Excise Department</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/icons/fav-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- BillDesk Web SDK UAT Scripts -->
   <script type="module" src="https://uat1.billdesk.com/u2/web/v1_2/sdk"></script>
  <script type="module" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.esm.js"></script>
  <script nomodule="" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk.js"></script>
  <link href="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.css" rel="stylesheet">
</head>

<body>
  <!-- Pre-bootstrap loader (shows before Angular renders) -->
  <style>
    #app-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 145, 77, 0.16), transparent 34%),
        radial-gradient(circle at 84% 82%, rgba(29, 78, 216, 0.12), transparent 36%),
        #f8fafc;
      font-family: Inter, 'Segoe UI', Roboto, Arial, sans-serif;
      opacity: 1;
      transition: opacity 220ms ease, visibility 220ms ease;
      transform: translateZ(0);
    }

    #app-preloader.is-leaving {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #app-preloader .card-outer {
      border-radius: 18px;
      padding: 1px;
      background: linear-gradient(135deg, rgba(255, 106, 0, 0.55), rgba(28, 43, 120, 0.28));
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.14);
    }

    #app-preloader .card {
      width: min(390px, calc(100vw - 40px));
      border-radius: 17px;
      padding: 26px 24px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: #ffffff;
    }

    /* ── Loader emblem: spinning ring + bottle center ── */
    #app-preloader .loader-emblem {
      width: 90px;
      height: 90px;
      display: grid;
      place-items: center;
      position: relative;
      contain: layout paint;
    }

    /* Spinning outer ring */
    #app-preloader .loader-ring {
      position: absolute;
      inset: 3px;
      border: 3px solid rgba(28, 43, 120, 0.14);
      border-radius: 999px;
      border-top-color: #ff6a00;
      border-right-color: rgba(255, 106, 0, 0.72);
      animation: loaderSpin 1s linear infinite;
      will-change: transform;
    }

    #app-preloader .loader-ring::after {
      content: '';
      position: absolute;
      width: 9px;
      height: 9px;
      top: 1px;
      left: 50%;
      border-radius: 50%;
      background: #ff6a00;
      transform: translateX(-50%);
      box-shadow: 0 0 0 4px rgba(255, 106, 0, 0.12);
    }

    /* Factory window clips the bottle slide */
    #app-preloader .factory-window {
      width: 34px;
      height: 54px;
      overflow: hidden;
      position: relative;
    }

    /* Bottle slides in → fills → slides out */
    #app-preloader .factory-belt {
      position: absolute;
      inset: 0;
      animation: factorySlide 2.8s ease-in-out infinite;
    }

    #app-preloader .factory-belt svg {
      width: 34px;
      height: 54px;
    }

    /* Liquid fills from TOP downward */
    #app-preloader .bottle-liquid {
      animation: liquidPour 2.8s ease-in-out infinite;
      transform-origin: center top;
    }

    @keyframes loaderSpin {
      to { transform: rotate(360deg); }
    }

    /* Slide in from left → stay → exit right */
    @keyframes factorySlide {
      0%   { transform: translateX(-46px); opacity: 0; }
      10%  { transform: translateX(0); opacity: 1; }
      80%  { transform: translateX(0); opacity: 1; }
      95%  { transform: translateX(46px); opacity: 0; }
      100% { transform: translateX(46px); opacity: 0; }
    }

    /* Pour from top: scaleY grows from top origin */
    @keyframes liquidPour {
      0%   { transform: scaleY(0); }
      10%  { transform: scaleY(0); }
      55%  { transform: scaleY(1); }
      80%  { transform: scaleY(1); }
      100% { transform: scaleY(1); }
    }

    #app-preloader .title {
      font-size: 15px;
      font-weight: 600;
      color: #1c2b78;
      letter-spacing: 0.3px;
    }

    #app-preloader .sub {
      font-size: 12px;
      color: rgba(2, 6, 23, 0.60);
      letter-spacing: 0.2px;
    }

    #app-preloader .progress-track {
      width: min(190px, 68vw);
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(28, 43, 120, 0.12);
      margin-top: -3px;
    }

    #app-preloader .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ff8a00, #ff5e00, #1c2b78);
      transition: width 220ms ease-out;
    }

  </style>

  <div id="app-preloader" aria-live="polite" aria-busy="true">
    <div class="card-outer">
      <div class="card">
        <div class="loader-emblem" aria-hidden="true">
          <div class="loader-ring"></div>
          <div class="factory-window">
            <div class="factory-belt">
              <svg viewBox="0 0 34 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                  <linearGradient id="liqGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#ffbb33" stop-opacity="0.95"/>
                    <stop offset="100%" stop-color="#ff8a00" stop-opacity="0.95"/>
                  </linearGradient>
                  <clipPath id="bottleClip">
                    <!-- Classic tapered liquor bottle shape -->
                    <path d="M14 1h6v4c0 1 .5 1.5 1 2l2.5 4c1.8 3 2.5 5 2.5 8v24c0 3-1 5.5-3.5 7C21 51.2 19 52 17 52s-4-.8-5.5-2C9 48.5 8 46 8 43V19c0-3 .7-5 2.5-8L13 7c.5-.5 1-1 1-2V1z"/>
                  </clipPath>
                </defs>
                <!-- Bottle outline – classic tapered liquor bottle -->
                <path d="M14 1h6v4c0 1 .5 1.5 1 2l2.5 4c1.8 3 2.5 5 2.5 8v24c0 3-1 5.5-3.5 7C21 51.2 19 52 17 52s-4-.8-5.5-2C9 48.5 8 46 8 43V19c0-3 .7-5 2.5-8L13 7c.5-.5 1-1 1-2V1z"
                      stroke="#ff7a00" stroke-width="1.6" fill="rgba(255,138,0,0.05)" stroke-linejoin="round" stroke-linecap="round"/>
                <!-- Bottle cap -->
                <rect x="14.5" y="0" width="5" height="2.5" rx="1" fill="#ff7a00" opacity="0.75"/>
                <!-- Liquid filling from top downward -->
                <rect class="bottle-liquid" x="8" y="1" width="18" height="51" fill="url(#liqGrad)"
                      clip-path="url(#bottleClip)" style="transform-origin: 17px 1px;"/>
                <!-- Glass shine highlight -->
                <path d="M13 12c0-.3.2-.5.5-.5h1.5c.4 0 .7.3.7.7v18c0 .3-.2.6-.5.6-.8-.2-1.5-.6-2-1.2-.2-.3-.1-.6.1-.8.3-.2.5-.5.5-.8V12z"
                      fill="white" opacity="0.3"/>
              </svg>
            </div>
          </div>
        </div>
        <div class="title">Loading...</div>
        <div class="sub">Please wait</div>
        <div class="progress-track" aria-hidden="true"><div class="progress-bar" id="app-preloader-progress"></div></div>
      </div>
    </div>
  </div>

  <script>
    // The browser does not expose exact Angular download progress. This gives
    // users a truthful, forward-only startup indicator up to 90%; main.ts
    // completes it at 100% when Angular has bootstrapped.
    (function () {
      var progress = document.getElementById('app-preloader-progress');
      if (!progress || !window.requestAnimationFrame) return;
      var startedAt = performance.now();
      function advance(now) {
        var elapsed = now - startedAt;
        var value = 90 * (1 - Math.exp(-elapsed / 1100));
        progress.style.width = Math.min(value, 90).toFixed(1) + '%';
        window.requestAnimationFrame(advance);
      }
      window.requestAnimationFrame(advance);
    }());
  </script>

  <app-root></app-root>
</body>

</html>
