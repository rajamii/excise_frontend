<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Excise Department</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="assets/icons/fav-icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  
  <!-- BillDesk Web SDK UAT Scripts -->
  <script type="module" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.esm.js"></script>
  <script nomodule="" src="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk.js"></script>
  <link href="https://uat1.billdesk.com/merchant-uat/sdk/dist/billdesksdk/billdesksdk.css" rel="stylesheet">

</head>

<body>
  <!-- Pre-bootstrap loader (shows even before Angular renders) -->
  <style>
    #app-preloader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.96);
      font-family: Roboto, Arial, sans-serif;
    }

    #app-preloader .card {
      width: min(480px, calc(100vw - 48px));
      border-radius: 14px;
      padding: 28px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 30px rgba(2, 6, 23, 0.14);
      background: #ffffff;
    }

    #app-preloader .glass-wrap {
      width: 86px;
      height: 86px;
      display: grid;
      place-items: center;
      position: relative;
    }

    #app-preloader .glass-glow {
      position: absolute;
      inset: -16px;
      border-radius: 999px;
      background: radial-gradient(circle at 50% 55%, rgba(255, 204, 0, 0.22), rgba(28, 43, 120, 0.05) 58%, transparent 72%);
      filter: blur(3px);
      animation: glowPulse 1.4s ease-in-out infinite;
    }

    #app-preloader .glass {
      width: 72px;
      height: 72px;
      animation: glassSway 1.6s ease-in-out infinite;
      filter: drop-shadow(0 10px 16px rgba(2, 6, 23, 0.16));
    }

    #app-preloader .sip-ring {
      stroke: rgba(28, 43, 120, 0.22);
      stroke-width: 3.2;
      fill: none;
    }

    #app-preloader .sip-arc {
      stroke: rgba(220, 38, 38, 0.95);
      stroke-width: 3.2;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 42 220;
      animation: sipArc 1.1s ease-in-out infinite;
    }

    #app-preloader .sip-orbit {
      transform-origin: 36px 36px;
      animation: sipSpin 1.1s linear infinite;
    }

    #app-preloader .sip-dot {
      fill: rgba(220, 38, 38, 0.95);
      filter: drop-shadow(0 2px 6px rgba(220, 38, 38, 0.35));
      transform-origin: 36px 8px;
      animation: sipDot 0.55s ease-in-out infinite;
    }

    #app-preloader .drink-wave {
      transform-origin: 36px 22px;
      animation: drinkWave 0.9s ease-in-out infinite;
    }

    #app-preloader .title {
      font-size: 15px;
      font-weight: 600;
      color: #1c2b78;
    }

    #app-preloader .sub {
      font-size: 12px;
      color: rgba(2, 6, 23, 0.72);
    }

    @keyframes glassSway {
      0% {
        transform: translateY(0) rotateZ(-6deg);
      }

      50% {
        transform: translateY(-2px) rotateZ(6deg);
      }

      100% {
        transform: translateY(0) rotateZ(-6deg);
      }
    }

    @keyframes glowPulse {

      0%,
      100% {
        transform: scale(0.98);
        opacity: 0.85;
      }

      50% {
        transform: scale(1.04);
        opacity: 1;
      }
    }

    @keyframes sipSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes sipArc {
      0% {
        stroke-dasharray: 40 220;
        stroke-dashoffset: 0;
        opacity: 0.95;
      }

      50% {
        stroke-dasharray: 70 220;
        stroke-dashoffset: -30;
        opacity: 1;
      }

      100% {
        stroke-dasharray: 40 220;
        stroke-dashoffset: -90;
        opacity: 0.95;
      }
    }

    @keyframes sipDot {

      0%,
      100% {
        transform: scale(0.9);
        opacity: 0.9;
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    @keyframes drinkWave {
      0% {
        transform: translateY(0);
        opacity: 0.88;
      }

      50% {
        transform: translateY(-0.8px);
        opacity: 0.95;
      }

      100% {
        transform: translateY(0);
        opacity: 0.88;
      }
    }
  </style>

  <div id="app-preloader" aria-live="polite" aria-busy="true">
    <div class="card">
      <div class="glass-wrap" aria-hidden="true">
        <div class="glass-glow"></div>
        <!-- Glass design (no bottle) -->
        <svg class="glass" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="glassCup" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1c2b78" stop-opacity="0.18" />
              <stop offset="0.55" stop-color="#1c2b78" stop-opacity="0.10" />
              <stop offset="1" stop-color="#0b122b" stop-opacity="0.16" />
            </linearGradient>
            <linearGradient id="glassStroke" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#1c2b78" stop-opacity="0.55" />
              <stop offset="1" stop-color="#0b122b" stop-opacity="0.55" />
            </linearGradient>
            <linearGradient id="drink" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffcc00" stop-opacity="0.92" />
              <stop offset="1" stop-color="#ff8a00" stop-opacity="0.92" />
            </linearGradient>
            <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
              <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
            </linearGradient>
          </defs>

          <!-- Round “sip” effect -->
          <circle class="sip-ring" cx="36" cy="36" r="28"></circle>
          <circle class="sip-arc" cx="36" cy="36" r="28"></circle>
          <g class="sip-orbit">
            <circle class="sip-dot" cx="36" cy="8" r="2.35"></circle>
          </g>

          <path
            d="M22 14c0-2.8 2.2-5 5-5h18c2.8 0 5 2.2 5 5 0 9.4-6.1 17.6-14.2 20.3V44h6.8c2 0 3.7 1.7 3.7 3.7S44.6 51.4 42.6 51.4H29.4c-2 0-3.7-1.7-3.7-3.7S27.4 44 29.4 44h6.8v-9.7C28.1 31.6 22 23.4 22 14z"
            fill="url(#glassCup)" stroke="url(#glassStroke)" stroke-width="1.6" />

          <path class="drink-wave"
            d="M26.6 16.4c.2-1.2 1.3-2.1 2.6-2.1h13.6c1.3 0 2.4.9 2.6 2.1-.8 6.5-5.5 12.2-11.9 14.4-6.4-2.2-11.1-7.9-11.9-14.4z"
            fill="url(#drink)" opacity="0.9" />

          <path
            d="M28.8 13.2h2.2c.9 0 1.6.7 1.6 1.6v13.7c0 .8-.6 1.5-1.4 1.6-2.2-.9-4.2-2.5-5.8-4.7-.5-.7 0-1.6.9-1.6h.4c.7 0 1.3-.6 1.3-1.3V13.2z"
            fill="url(#shine)" opacity="0.55" />
        </svg>
      </div>
      <div class="title">Loading...</div>
      <div class="sub">Please wait</div>
    </div>
  </div>

  <app-root></app-root>
</body>

</html>
